<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="tfm" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#c8a870" stop-opacity=".15"/><stop offset="50%" stop-color="#c87820" stop-opacity=".4"/><stop offset="100%" stop-color="#2a5a3a" stop-opacity=".15"/></linearGradient><style>.bg{fill:#f4f0e8}@media(prefers-color-scheme:dark){.bg{fill:#0a0806}}</style></defs><rect width="1200" height="600" class="bg"/><rect x="0" y="0" width="1200" height="600" fill="url(#tfm)"/><line x1="600" y1="80" x2="600" y2="520" stroke="#c87820" stroke-width="2" opacity=".5"/><polygon points="600,80 588,108 612,108" fill="#c87820" opacity=".5"/><text x="600" y="62" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#c87820" opacity=".7">Opportunity</text><text x="300" y="130" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#6a4818" font-weight="bold" opacity=".7">Before</text><text x="900" y="130" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#1a4a2a" font-weight="bold" opacity=".7">After</text><text x="300" y="210" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#6a4818" opacity=".65">Fixed geography</text><text x="300" y="240" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#6a4818" opacity=".65">Limited information</text><text x="300" y="270" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#6a4818" opacity=".65">Constrained network</text><text x="300" y="300" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#6a4818" opacity=".65">Invisible ceiling</text><text x="300" y="330" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#6a4818" opacity=".65">Single path</text><text x="300" y="360" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#6a4818" opacity=".65">Risk without safety</text><text x="900" y="210" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#1a4a2a" opacity=".75">Expanded geography</text><text x="900" y="240" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#1a4a2a" opacity=".75">Open information</text><text x="900" y="270" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#1a4a2a" opacity=".75">Compounding network</text><text x="900" y="300" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#1a4a2a" opacity=".75">Visible horizon</text><text x="900" y="330" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#1a4a2a" opacity=".75">Multiple paths</text><text x="900" y="360" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#1a4a2a" opacity=".75">Risk with support</text><text x="600" y="490" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#4a3818" opacity=".5" font-style="italic">"Opportunity does not change effort. It changes what effort can reach."</text></svg>