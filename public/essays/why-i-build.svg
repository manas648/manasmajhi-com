<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg"><defs><style>.bg{fill:#f4f0e8}.lbl{font-family:Georgia,serif;font-size:13px;fill:#4a3818}@media(prefers-color-scheme:dark){.bg{fill:#0a0806}.lbl{fill:#c8b880}}</style></defs><rect width="1200" height="600" class="bg"/><circle cx="600" cy="270" r="130" fill="#2a4060" opacity=".05" stroke="#2a4060" stroke-width="1.5"/><circle cx="600" cy="270" r="90" fill="#2a4060" opacity=".06" stroke="#2a4060" stroke-width="1"/><circle cx="600" cy="270" r="50" fill="#2a4060" opacity=".08"/><text x="600" y="266" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#2a4060" font-weight="bold">Because broken</text><text x="600" y="284" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#2a4060" font-weight="bold">hiring blocks opportunity</text><text x="600" y="140" text-anchor="middle" class="lbl" fill="#2a4060" opacity=".65">To prove origin is not destiny</text><text x="830" y="195" class="lbl" fill="#2a4060" opacity=".6">To compound</text><text x="830" y="213" class="lbl" fill="#2a4060" opacity=".6">something over time</text><text x="870" y="330" class="lbl" fill="#2a4060" opacity=".6">To create what</text><text x="870" y="348" class="lbl" fill="#2a4060" opacity=".6">did not exist</text><text x="600" y="430" text-anchor="middle" class="lbl" fill="#2a4060" opacity=".6">To employ people who believe in the mission</text><text x="240" y="330" text-anchor="end" class="lbl" fill="#2a4060" opacity=".6">To solve problems</text><text x="240" y="348" text-anchor="end" class="lbl" fill="#2a4060" opacity=".6">that matter</text><text x="270" y="195" text-anchor="end" class="lbl" fill="#2a4060" opacity=".6">To understand</text><text x="270" y="213" text-anchor="end" class="lbl" fill="#2a4060" opacity=".6">systems by building</text><line x1="380" y1="145" x2="540" y2="235" stroke="#c8b880" stroke-width="1" opacity=".3"/><line x1="810" y1="198" x2="678" y2="240" stroke="#c8b880" stroke-width="1" opacity=".3"/><line x1="850" y1="330" x2="692" y2="290" stroke="#c8b880" stroke-width="1" opacity=".3"/><line x1="600" y1="422" x2="600" y2="360" stroke="#c8b880" stroke-width="1" opacity=".3"/><line x1="225" y1="330" x2="518" y2="290" stroke="#c8b880" stroke-width="1" opacity=".3"/><line x1="260" y1="198" x2="522" y2="242" stroke="#c8b880" stroke-width="1" opacity=".3"/><text x="600" y="536" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#4a3818" opacity=".5" font-style="italic">"Building is thinking made visible."</text></svg>