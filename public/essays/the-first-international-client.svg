<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg"><defs><style>.bg{fill:#f4f0e8}.lbl{font-family:Georgia,serif;font-size:12px;fill:#4a3818}@media(prefers-color-scheme:dark){.bg{fill:#0a0806}.lbl{fill:#c8b880}}</style></defs><rect width="1200" height="600" class="bg"/><circle cx="350" cy="280" r="60" fill="#c87020" opacity=".15" stroke="#c87020" stroke-width="1.5"/><text x="350" y="275" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#c87020" font-weight="bold">Odisha</text><text x="350" y="292" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#c87020" opacity=".7">India</text><circle cx="850" cy="280" r="60" fill="#2a4060" opacity=".15" stroke="#2a4060" stroke-width="1.5"/><text x="850" y="275" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#2a4060" font-weight="bold">International</text><text x="850" y="292" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#2a4060" opacity=".7">client</text><path d="M410,270 Q600,200 790,270" fill="none" stroke="#2a5a3a" stroke-width="2.5" stroke-linecap="round" opacity=".7" stroke-dasharray="8,4"/><circle cx="600" cy="220" r="6" fill="#2a5a3a" opacity=".8"/><text x="600" y="208" text-anchor="middle" class="lbl" fill="#2a5a3a">First bridge</text><rect x="200" y="380" width="300" height="70" rx="8" fill="#c87020" opacity=".08" stroke="#c87020" stroke-width="1"/><text x="350" y="402" text-anchor="middle" class="lbl" fill="#c87020">The proof of concept</text><text x="350" y="420" text-anchor="middle" class="lbl" fill="#c87020" font-size="10" opacity=".7">that we could compete globally.</text><text x="350" y="437" text-anchor="middle" class="lbl" fill="#c87020" font-size="10" opacity=".7">From Odisha.</text><rect x="700" y="380" width="300" height="70" rx="8" fill="#2a4060" opacity=".08" stroke="#2a4060" stroke-width="1"/><text x="850" y="402" text-anchor="middle" class="lbl" fill="#2a4060">What changed:</text><text x="850" y="420" text-anchor="middle" class="lbl" fill="#2a4060" font-size="10" opacity=".7">Not geography. Not resources.</text><text x="850" y="437" text-anchor="middle" class="lbl" fill="#2a4060" font-size="10" opacity=".7">The belief that it was possible.</text><text x="600" y="510" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#4a3818" opacity=".5" font-style="italic">"The first international client does not change your capability. It changes your self-image."</text></svg>