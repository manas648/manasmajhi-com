<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg"><defs><style>.bg{fill:#f4f0e8}.lbl{font-family:Georgia,serif;font-size:12px;fill:#4a3818}.num{font-family:Georgia,serif;font-size:28px;font-weight:bold;fill:#8a2010}@media(prefers-color-scheme:dark){.bg{fill:#0a0806}.lbl{fill:#c8b880}.num{fill:#c04020}}</style></defs><rect width="1200" height="600" class="bg"/><text x="600" y="65" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#8a2010" opacity=".7" font-weight="bold">Four Ways Hiring Infrastructure Fails</text><rect x="80" y="100" width="490" height="200" rx="10" fill="#8a2010" opacity=".06" stroke="#8a2010" stroke-width="1.2"/><text x="120" y="145" class="num">01</text><text x="200" y="145" font-family="Georgia,serif" font-size="15" fill="#8a2010" font-weight="bold">Intake failure</text><text x="120" y="172" class="lbl">The role brief is vague. No one agrees</text><text x="120" y="190" class="lbl">on what "success" actually means.</text><text x="120" y="212" class="lbl" fill="#8a6040" font-style="italic" opacity=".7">Result: wrong candidates, wasted outreach.</text><rect x="630" y="100" width="490" height="200" rx="10" fill="#8a2010" opacity=".06" stroke="#8a2010" stroke-width="1.2"/><text x="670" y="145" class="num">02</text><text x="750" y="145" font-family="Georgia,serif" font-size="15" fill="#8a2010" font-weight="bold">Pipeline failure</text><text x="670" y="172" class="lbl">Sourcing runs dry. No second-tier</text><text x="670" y="190" class="lbl">candidates. A single name disappears.</text><text x="670" y="212" class="lbl" fill="#8a6040" font-style="italic" opacity=".7">Result: mandate stalls. Clock runs out.</text><rect x="80" y="330" width="490" height="200" rx="10" fill="#8a2010" opacity=".06" stroke="#8a2010" stroke-width="1.2"/><text x="120" y="375" class="num">03</text><text x="200" y="375" font-family="Georgia,serif" font-size="15" fill="#8a2010" font-weight="bold">Stakeholder failure</text><text x="120" y="402" class="lbl">Decision-makers disagree. Committees</text><text x="120" y="420" class="lbl">add criteria mid-search. Process drifts.</text><text x="120" y="442" class="lbl" fill="#8a6040" font-style="italic" opacity=".7">Result: candidate fatigue and dropout.</text><rect x="630" y="330" width="490" height="200" rx="10" fill="#8a2010" opacity=".06" stroke="#8a2010" stroke-width="1.2"/><text x="670" y="375" class="num">04</text><text x="750" y="375" font-family="Georgia,serif" font-size="15" fill="#8a2010" font-weight="bold">Close failure</text><text x="670" y="402" class="lbl">Offer comes late, low, or misaligned.</text><text x="670" y="420" class="lbl">Candidate declines after months of work.</text><text x="670" y="442" class="lbl" fill="#8a6040" font-style="italic" opacity=".7">Result: restart from zero.</text></svg>