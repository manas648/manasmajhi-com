<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg"><defs><style>.bg{fill:#060c14}.bar-green{fill:#2a6a3a}.bar-amber{fill:#c87020}.bar-red{fill:#8a2010}.lbl{font-family:Georgia,serif;font-size:11px;fill:#8090a0}@media(prefers-color-scheme:dark){.bg{fill:#030810}}</style></defs><rect width="1200" height="600" class="bg"/><text x="600" y="55" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#60a0d0" opacity=".8" font-weight="bold">Hiring Health Score™</text><rect x="100" y="90" width="1000" height="80" rx="8" fill="#0e1e2e" opacity=".9"/><text x="130" y="120" font-family="Georgia,serif" font-size="12" fill="#4080b0">Mandate: VP of Engineering — TechCo</text><text x="130" y="145" font-family="Georgia,serif" font-size="11" fill="#304050">Day 23 of 50-day target</text><rect x="800" y="102" width="120" height="56" rx="6" fill="#2a6a3a" opacity=".85"/><text x="860" y="130" text-anchor="middle" font-family="Georgia,serif" font-size="20" fill="white" font-weight="bold">78</text><text x="860" y="148" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#90d8a0">HEALTHY</text><text x="130" y="210" class="lbl">Pipeline velocity</text><rect x="280" y="195" width="600" height="16" rx="4" fill="#0e2030"/><rect x="280" y="195" width="480" height="16" rx="4" class="bar-green" opacity=".8"/><text x="900" y="208" class="lbl">80%</text><text x="130" y="245" class="lbl">Shortlist quality</text><rect x="280" y="230" width="600" height="16" rx="4" fill="#0e2030"/><rect x="280" y="230" width="420" height="16" rx="4" class="bar-green" opacity=".75"/><text x="900" y="243" class="lbl">70%</text><text x="130" y="280" class="lbl">Stakeholder alignment</text><rect x="280" y="265" width="600" height="16" rx="4" fill="#0e2030"/><rect x="280" y="265" width="330" height="16" rx="4" class="bar-amber" opacity=".8"/><text x="900" y="278" class="lbl">55%</text><text x="130" y="315" class="lbl">Response rate</text><rect x="280" y="300" width="600" height="16" rx="4" fill="#0e2030"/><rect x="280" y="300" width="480" height="16" rx="4" class="bar-green" opacity=".8"/><text x="900" y="313" class="lbl">80%</text><text x="130" y="350" class="lbl">Time to feedback</text><rect x="280" y="335" width="600" height="16" rx="4" fill="#0e2030"/><rect x="280" y="335" width="180" height="16" rx="4" class="bar-red" opacity=".8"/><text x="900" y="348" class="lbl">30% ⚠</text><rect x="100" y="390" width="1000" height="70" rx="6" fill="#8a2010" opacity=".15" stroke="#8a2010" stroke-width="1"/><text x="130" y="415" font-family="Georgia,serif" font-size="12" fill="#e05030">⚠ Alert: Stakeholder feedback SLA breached (3 days)</text><text x="130" y="440" font-family="Georgia,serif" font-size="11" fill="#a05030" opacity=".8">Recommend: escalate to hiring manager. Risk of candidate dropout in 5 days.</text><text x="600" y="545" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#607080" opacity=".6" font-style="italic">"What gets measured gets managed. What gets scored gets fixed."</text></svg>