<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg"><defs><style>.bg{fill:#f4f0e8}.lbl{font-family:Georgia,serif;font-size:12px;fill:#4a3818}@media(prefers-color-scheme:dark){.bg{fill:#0a0806}.lbl{fill:#c8b880}}</style></defs><rect width="1200" height="600" class="bg"/><line x1="600" y1="80" x2="600" y2="520" stroke="#c8b880" stroke-width="1" stroke-dasharray="6,4" opacity=".4"/><text x="300" y="82" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#c87020" font-weight="bold">Success</text><text x="900" y="82" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#2a5a3a" font-weight="bold">Contentment</text><rect x="80" y="110" width="440" height="44" rx="6" fill="#c87020" opacity=".12"/><text x="300" y="128" text-anchor="middle" class="lbl" fill="#c87020">External definition. Others set the bar.</text><text x="300" y="146" text-anchor="middle" class="lbl" fill="#c87020" font-size="10" opacity=".7">Reactive</text><rect x="80" y="166" width="440" height="44" rx="6" fill="#c87020" opacity=".12"/><text x="300" y="184" text-anchor="middle" class="lbl" fill="#c87020">Moves when you reach it.</text><text x="300" y="202" text-anchor="middle" class="lbl" fill="#c87020" font-size="10" opacity=".7">Always one more thing.</text><rect x="80" y="222" width="440" height="44" rx="6" fill="#c87020" opacity=".1"/><text x="300" y="240" text-anchor="middle" class="lbl" fill="#c87020">Comparative. Relative to peers.</text><text x="300" y="258" text-anchor="middle" class="lbl" fill="#c87020" font-size="10" opacity=".7">Zero-sum in its framing.</text><rect x="80" y="278" width="440" height="44" rx="6" fill="#c87020" opacity=".1"/><text x="300" y="296" text-anchor="middle" class="lbl" fill="#c87020">Anxiety in the gap. Always chasing.</text><text x="300" y="314" text-anchor="middle" class="lbl" fill="#c87020" font-size="10" opacity=".7">Never arriving.</text><rect x="80" y="334" width="440" height="44" rx="6" fill="#c87020" opacity=".08"/><text x="300" y="352" text-anchor="middle" class="lbl" fill="#c87020">Fuel: comparison, envy, fear.</text><text x="300" y="370" text-anchor="middle" class="lbl" fill="#c87020" font-size="10" opacity=".7">Reliable. Corrosive over time.</text><rect x="680" y="110" width="440" height="44" rx="6" fill="#2a5a3a" opacity=".12"/><text x="900" y="128" text-anchor="middle" class="lbl" fill="#2a5a3a">Internal definition. You set the bar.</text><text x="900" y="146" text-anchor="middle" class="lbl" fill="#2a5a3a" font-size="10" opacity=".7">And reset it.</text><rect x="680" y="166" width="440" height="44" rx="6" fill="#2a5a3a" opacity=".12"/><text x="900" y="184" text-anchor="middle" class="lbl" fill="#2a5a3a">Present even in the journey.</text><text x="900" y="202" text-anchor="middle" class="lbl" fill="#2a5a3a" font-size="10" opacity=".7">Not conditional on outcome.</text><rect x="680" y="222" width="440" height="44" rx="6" fill="#2a5a3a" opacity=".1"/><text x="900" y="240" text-anchor="middle" class="lbl" fill="#2a5a3a">Absolute. Grounded in values.</text><text x="900" y="258" text-anchor="middle" class="lbl" fill="#2a5a3a" font-size="10" opacity=".7">Not affected by what others do.</text><rect x="680" y="278" width="440" height="44" rx="6" fill="#2a5a3a" opacity=".1"/><text x="900" y="296" text-anchor="middle" class="lbl" fill="#2a5a3a">Peace in the present. Still ambitious.</text><text x="900" y="314" text-anchor="middle" class="lbl" fill="#2a5a3a" font-size="10" opacity=".7">Not desperate.</text><rect x="680" y="334" width="440" height="44" rx="6" fill="#2a5a3a" opacity=".1"/><text x="900" y="352" text-anchor="middle" class="lbl" fill="#2a5a3a">Fuel: purpose, curiosity, meaning.</text><text x="900" y="370" text-anchor="middle" class="lbl" fill="#2a5a3a" font-size="10" opacity=".7">Sustainable over a lifetime.</text><text x="600" y="500" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#4a3818" opacity=".5" font-style="italic">"You can want more and still be at peace with where you are."</text></svg>