<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg"><defs><style>.bg{fill:#f4f0e8}.lbl{font-family:Georgia,serif;font-size:11px;fill:#4a3818}@media(prefers-color-scheme:dark){.bg{fill:#0a0806}.lbl{fill:#c8b880}}</style></defs><rect width="1200" height="600" class="bg"/><line x1="80" y1="420" x2="1120" y2="420" stroke="#c8b880" stroke-width="1.5" opacity=".4"/><text x="80" y="445" class="lbl" opacity=".5">Today</text><text x="400" y="445" text-anchor="middle" class="lbl" opacity=".5">1 year</text><text x="700" y="445" text-anchor="middle" class="lbl" opacity=".5">5 years</text><text x="1000" y="445" text-anchor="middle" class="lbl" opacity=".5">10 years</text><path d="M80,380 Q200,370 400,350 Q500,340 600,320 Q700,300 800,270 Q950,220 1120,150" fill="none" stroke="#2a5a3a" stroke-width="3" stroke-linecap="round" opacity=".8"/><path d="M80,390 Q200,385 400,378 Q500,373 600,365 Q650,360 700,355" fill="none" stroke="#c87020" stroke-width="3" stroke-linecap="round" opacity=".7"/><path d="M700,355 Q750,350 800,355 Q900,360 1000,370 Q1060,375 1120,380" fill="none" stroke="#c87020" stroke-width="2" stroke-linecap="round" opacity=".3" stroke-dasharray="6,4"/><text x="1130" y="155" class="lbl" fill="#2a5a3a">Long-term</text><text x="1130" y="170" class="lbl" fill="#2a5a3a">thinker</text><text x="1130" y="380" class="lbl" fill="#c87020">Short-term</text><text x="1130" y="395" class="lbl" fill="#c87020">thinker</text><rect x="650" y="280" width="4" height="140" fill="#c8a870" opacity=".4"/><text x="660" y="290" class="lbl" opacity=".5">divergence</text><rect x="80" y="110" width="380" height="60" rx="8" fill="#c87020" opacity=".08" stroke="#c87020" stroke-width="1"/><text x="270" y="133" text-anchor="middle" class="lbl" fill="#c87020">Short-term: fast feedback, quick wins.</text><text x="270" y="152" text-anchor="middle" class="lbl" fill="#c87020">Optimises for approval.</text><rect x="80" y="190" width="380" height="60" rx="8" fill="#2a5a3a" opacity=".1" stroke="#2a5a3a" stroke-width="1"/><text x="270" y="213" text-anchor="middle" class="lbl" fill="#2a5a3a">Long-term: compounding assets, depth.</text><text x="270" y="232" text-anchor="middle" class="lbl" fill="#2a5a3a">Optimises for outcomes.</text><text x="600" y="530" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#4a3818" opacity=".5" font-style="italic">"Short-term thinking is contagious. Long-term thinking is a competitive advantage."</text></svg>