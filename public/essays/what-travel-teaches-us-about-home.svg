<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg"><defs><style>.bg{fill:#f4f0e8}.lbl{font-family:Georgia,serif;font-size:12px;fill:#4a3818}@media(prefers-color-scheme:dark){.bg{fill:#0a0806}.lbl{fill:#c8b880}}</style></defs><rect width="1200" height="600" class="bg"/><circle cx="350" cy="260" r="140" fill="#c87020" opacity=".06" stroke="#c87020" stroke-width="1.5"/><circle cx="850" cy="260" r="140" fill="#2a4060" opacity=".06" stroke="#2a4060" stroke-width="1.5"/><text x="350" y="240" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#c87020" opacity=".7" font-weight="bold">Away</text><text x="850" y="240" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#2a4060" opacity=".7" font-weight="bold">Home</text><text x="350" y="270" text-anchor="middle" class="lbl" fill="#c87020" opacity=".65">You notice what is missing.</text><text x="350" y="290" text-anchor="middle" class="lbl" fill="#c87020" opacity=".55">You understand contrast.</text><text x="350" y="310" text-anchor="middle" class="lbl" fill="#c87020" opacity=".5">You see through fresh eyes.</text><text x="850" y="270" text-anchor="middle" class="lbl" fill="#2a4060" opacity=".65">You see what you never did.</text><text x="850" y="290" text-anchor="middle" class="lbl" fill="#2a4060" opacity=".55">You appreciate what was invisible.</text><text x="850" y="310" text-anchor="middle" class="lbl" fill="#2a4060" opacity=".5">You arrive back, changed.</text><path d="M490,260 Q600,200 710,260" fill="none" stroke="#2a5a3a" stroke-width="2" stroke-linecap="round" opacity=".6" stroke-dasharray="6,4"/><path d="M710,260 Q600,320 490,260" fill="none" stroke="#2a5a3a" stroke-width="2" stroke-linecap="round" opacity=".4" stroke-dasharray="6,4"/><circle cx="600" cy="230" r="5" fill="#2a5a3a" opacity=".7"/><circle cx="600" cy="290" r="5" fill="#2a5a3a" opacity=".5"/><text x="615" y="228" class="lbl" fill="#2a5a3a" font-size="10">departure</text><text x="615" y="290" class="lbl" fill="#2a5a3a" font-size="10">return</text><rect x="300" y="420" width="600" height="60" rx="8" fill="#2a5a3a" opacity=".06" stroke="#2a5a3a" stroke-width="1"/><text x="600" y="445" text-anchor="middle" class="lbl" fill="#2a5a3a" opacity=".7">You cannot fully understand where you come from</text><text x="600" y="465" text-anchor="middle" class="lbl" fill="#2a5a3a" opacity=".7">until you have been somewhere else.</text><text x="600" y="530" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#4a3818" opacity=".5" font-style="italic">"Travel is the mirror that shows you the home you stopped seeing."</text></svg>