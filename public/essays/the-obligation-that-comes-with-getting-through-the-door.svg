<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="doorlight" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#f0c840" stop-opacity="0"/><stop offset="100%" stop-color="#f0c840" stop-opacity=".25"/></linearGradient><style>.bg{fill:#f0ece4}.door{fill:#3a2010}.door-open{fill:#2a1808}@media(prefers-color-scheme:dark){.bg{fill:#080604}.door{fill:#5a3820}.door-open{fill:#3a2010}}</style></defs><rect width="1200" height="600" class="bg"/><rect x="400" y="120" width="400" height="380" rx="6" class="door" opacity=".8"/><rect x="590" y="120" width="210" height="380" rx="0" class="door-open" opacity=".9"/><rect x="590" y="120" width="210" height="380" fill="url(#doorlight)"/><line x1="590" y1="120" x2="800" y2="120" stroke="#c8a860" stroke-width="2" opacity=".5"/><line x1="590" y1="500" x2="800" y2="500" stroke="#c8a860" stroke-width="2" opacity=".5"/><circle cx="575" cy="310" r="8" fill="#c8a860" opacity=".7"/><path d="M800,120 Q790,310 800,500" fill="none" stroke="#f0c840" stroke-width="2.5" opacity=".5"/><path d="M800,120 L800,500" fill="none" stroke="#c8a860" stroke-width="1.5" opacity=".3"/><circle cx="820" cy="200" r="6" fill="#f0c840" opacity=".7"/><circle cx="830" cy="310" r="6" fill="#f0c840" opacity=".7"/><circle cx="820" cy="420" r="6" fill="#f0c840" opacity=".7"/><text x="940" y="215" font-family="Georgia,serif" font-size="13" fill="#c87820" opacity=".7">Hold the door.</text><text x="940" y="315" font-family="Georgia,serif" font-size="13" fill="#c87820" opacity=".7">Look back.</text><text x="940" y="415" font-family="Georgia,serif" font-size="13" fill="#c87820" opacity=".7">Bring someone through.</text><text x="600" y="560" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#4a3818" opacity=".5" font-style="italic">"Getting through the door is not the end of the story."</text></svg>