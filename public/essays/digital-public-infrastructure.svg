<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
<defs>
  <style>
    .bg{fill:#f6f2ec}.layer{stroke-width:0}.lbl{font-family:Georgia,serif;font-size:13px;fill:#f5ede0;font-weight:bold}.sub{font-family:Georgia,serif;font-size:10px;fill:#c8b898;font-style:italic}
    @media(prefers-color-scheme:dark){.bg{fill:#0a0806}}
  </style>
</defs>
<rect width="1200" height="600" class="bg"/>
<!-- Stack layers — bottom to top, each represents a layer of DPI -->
<!-- Layer 1: Physical / Identity -->
<rect x="80" y="490" width="1040" height="68" rx="6" fill="#5a3a1a" opacity=".9"/>
<text x="600" y="521" text-anchor="middle" class="lbl" font-size="15">Identity Layer — Aadhaar</text>
<text x="600" y="541" text-anchor="middle" class="sub">1.4 billion enrolled</text>
<!-- Layer 2: Payments -->
<rect x="110" y="410" width="980" height="68" rx="6" fill="#7a4a20" opacity=".88"/>
<text x="600" y="441" text-anchor="middle" class="lbl" font-size="15">Payments — UPI</text>
<text x="600" y="461" text-anchor="middle" class="sub">10 billion transactions / month</text>
<!-- Layer 3: Data / Consent -->
<rect x="140" y="330" width="920" height="68" rx="6" fill="#3a5a2a" opacity=".85"/>
<text x="600" y="361" text-anchor="middle" class="lbl" font-size="15">Data Consent — Account Aggregator</text>
<text x="600" y="381" text-anchor="middle" class="sub">Open financial data portability</text>
<!-- Layer 4: Health -->
<rect x="170" y="250" width="860" height="68" rx="6" fill="#2a3a6a" opacity=".85"/>
<text x="600" y="281" text-anchor="middle" class="lbl" font-size="15">Health — ABDM</text>
<text x="600" y="301" text-anchor="middle" class="sub">Unified health records infrastructure</text>
<!-- Layer 5: Commerce / ONDC -->
<rect x="200" y="170" width="800" height="68" rx="6" fill="#4a2a6a" opacity=".82"/>
<text x="600" y="201" text-anchor="middle" class="lbl" font-size="15">Open Commerce — ONDC</text>
<text x="600" y="221" text-anchor="middle" class="sub">Democratising e-commerce access</text>
<!-- Layer 6: AI / future -->
<rect x="230" y="90" width="740" height="68" rx="6" fill="#1a3a5a" opacity=".8"/>
<text x="600" y="121" text-anchor="middle" class="lbl" font-size="15">AI Infrastructure — (emerging)</text>
<text x="600" y="141" text-anchor="middle" class="sub">The next layer being built</text>
<!-- Side braces -->
<line x1="68" y1="90" x2="68" y2="558" stroke="#c8a870" stroke-width="1.5" opacity=".4"/>
<line x1="1132" y1="90" x2="1132" y2="558" stroke="#c8a870" stroke-width="1.5" opacity=".4"/>
</svg>