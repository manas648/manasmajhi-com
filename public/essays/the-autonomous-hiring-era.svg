<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg"><defs><style>.bg{fill:#060c18}.lbl{font-family:Georgia,serif;font-size:11px;fill:#8090a8}@media(prefers-color-scheme:dark){.bg{fill:#030810}}</style></defs><rect width="1200" height="600" class="bg"/><text x="600" y="55" text-anchor="middle" font-family="Georgia,serif" font-size="17" fill="#60a0d0" opacity=".8" font-weight="bold">The Autonomous Hiring Era</text><rect x="80" y="90" width="1040" height="72" rx="8" fill="#1a3050" opacity=".7"/><text x="600" y="122" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#a0c0e0">Era 1 — Human-operated: recruiter calls, spreadsheets, gut feel</text><text x="600" y="148" text-anchor="middle" class="lbl" fill="#6090b0">1970s–2005 · Low data, high relationship, slow</text><rect x="80" y="178" width="1040" height="72" rx="8" fill="#1a3a50" opacity=".75"/><text x="600" y="210" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#a0c8e0">Era 2 — Software-assisted: ATS, LinkedIn, CRM, job boards</text><text x="600" y="236" text-anchor="middle" class="lbl" fill="#6090b0">2005–2022 · Workflow digitised, still human-decided, fragmented</text><rect x="80" y="266" width="1040" height="72" rx="8" fill="#1a4060" opacity=".8"/><text x="600" y="298" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#b0d0f0">Era 3 — AI-augmented: AI sourcing, screening, outreach drafts</text><text x="600" y="324" text-anchor="middle" class="lbl" fill="#6090b0">2022–now · Speed up, same broken ops underneath</text><rect x="80" y="354" width="1040" height="90" rx="8" fill="#1a5070" opacity=".85" stroke="#4090c0" stroke-width="1.5"/><text x="600" y="390" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#80c8ff" font-weight="bold">Era 4 — Autonomous execution: system detects, decides, recovers</text><text x="600" y="416" text-anchor="middle" class="lbl" fill="#60b0d0">Now building · Mandate health · Failure prediction · Auto-recovery</text><text x="600" y="436" text-anchor="middle" class="lbl" fill="#4090b0" font-size="10">Majhi OS</text><text x="600" y="530" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#506080" opacity=".55" font-style="italic">"The question is not whether hiring becomes autonomous. It is who builds the infrastructure."</text></svg>