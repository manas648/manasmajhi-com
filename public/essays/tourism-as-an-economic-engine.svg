<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg"><defs><style>.bg{fill:#f4f0e8}.lbl{font-family:Georgia,serif;font-size:11px;fill:#4a3818}@media(prefers-color-scheme:dark){.bg{fill:#0a0806}.lbl{fill:#c8b880}}</style></defs><rect width="1200" height="600" class="bg"/><text x="600" y="56" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#2a4060" opacity=".7" font-weight="bold">Tourism as an Economic Engine — The Numbers</text><text x="160" y="490" text-anchor="middle" class="lbl" opacity=".6">Arrivals</text><rect x="130" y="200" width="60" height="260" rx="4" fill="#2a4060" opacity=".6"/><text x="160" y="192" text-anchor="middle" class="lbl" fill="#2a4060">1.4B</text><text x="310" y="490" text-anchor="middle" class="lbl" opacity=".6">Global GDP</text><rect x="280" y="280" width="60" height="180" rx="4" fill="#2a4060" opacity=".5"/><text x="310" y="272" text-anchor="middle" class="lbl" fill="#2a4060">10%</text><text x="460" y="490" text-anchor="middle" class="lbl" opacity=".6">Jobs</text><rect x="430" y="240" width="60" height="220" rx="4" fill="#2a4060" opacity=".55"/><text x="460" y="232" text-anchor="middle" class="lbl" fill="#2a4060">330M</text><text x="610" y="490" text-anchor="middle" class="lbl" opacity=".6">India share</text><rect x="580" y="380" width="60" height="80" rx="4" fill="#c87020" opacity=".6"/><text x="610" y="372" text-anchor="middle" class="lbl" fill="#c87020">8%</text><text x="760" y="490" text-anchor="middle" class="lbl" opacity=".6">Odisha share</text><rect x="730" y="420" width="60" height="40" rx="4" fill="#c87020" opacity=".4"/><text x="760" y="412" text-anchor="middle" class="lbl" fill="#c87020" opacity=".6">untapped</text><line x1="80" y1="460" x2="1120" y2="460" stroke="#c8b880" stroke-width="1" opacity=".4"/><rect x="850" y="160" width="280" height="200" rx="8" fill="#2a5a3a" opacity=".08" stroke="#2a5a3a" stroke-width="1"/><text x="990" y="188" text-anchor="middle" class="lbl" fill="#2a5a3a">What tourism really is:</text><text x="990" y="212" text-anchor="middle" class="lbl" fill="#2a5a3a" opacity=".7">Export that travels to you.</text><text x="990" y="232" text-anchor="middle" class="lbl" fill="#2a5a3a" opacity=".7">Foreign exchange that stays.</text><text x="990" y="252" text-anchor="middle" class="lbl" fill="#2a5a3a" opacity=".7">Jobs that distribute locally.</text><text x="990" y="272" text-anchor="middle" class="lbl" fill="#2a5a3a" opacity=".7">Infrastructure that locals use.</text><text x="990" y="292" text-anchor="middle" class="lbl" fill="#2a5a3a" opacity=".7">Soft power that compounds.</text><text x="990" y="312" text-anchor="middle" class="lbl" fill="#2a5a3a" opacity=".7">A multiplier, not a niche.</text><text x="600" y="548" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#4a3818" opacity=".5" font-style="italic">"Tourism is an economic multiplier that most governments treat as a photo opportunity."</text></svg>