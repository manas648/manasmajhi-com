<!-- Scale label -->
<text x="100" y="360" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#8a6040" opacity=".7">1</text>
<text x="1100" y="120" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#8a6040" opacity=".7">1.4 billion</text>
<!-- Baseline -->
<line x1="80" y1="340" x2="1120" y2="340" stroke="#c8a870" stroke-width=".8" opacity=".3"/>
</svg>