<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg"><defs><style>.bg{fill:#0a0614}.lbl{font-family:Georgia,serif;font-size:12px;fill:#b0a8c8}@media(prefers-color-scheme:dark){.bg{fill:#050310}}</style></defs><rect width="1200" height="600" class="bg"/><circle cx="600" cy="240" r="8" fill="#f0e8d8" opacity=".9"/><circle cx="600" cy="240" r="20" fill="none" stroke="#f0e8d8" stroke-width="1" opacity=".3"/><circle cx="600" cy="240" r="35" fill="none" stroke="#f0e8d8" stroke-width=".8" opacity=".2"/><rect x="560" y="280" width="80" height="120" rx="4" fill="none" stroke="#d0c8e8" stroke-width="1" opacity=".3"/><rect x="565" y="285" width="70" height="100" rx="2" fill="#1a1428" opacity=".8"/><rect x="570" y="305" width="60" height="5" rx="1" fill="#4090f0" opacity=".6"/><rect x="570" y="316" width="50" height="4" rx="1" fill="#4090f0" opacity=".3"/><rect x="570" y="326" width="55" height="4" rx="1" fill="#4090f0" opacity=".3"/><text x="600" y="60" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#b0a8c8" opacity=".7">12:47 AM</text><text x="240" y="200" text-anchor="middle" class="lbl" opacity=".5">The call no one sees you take.</text><text x="960" y="200" text-anchor="middle" class="lbl" opacity=".5">The hours that don't get counted.</text><text x="240" y="380" text-anchor="middle" class="lbl" opacity=".45">The worry you carry so others won't.</text><text x="960" y="380" text-anchor="middle" class="lbl" opacity=".45">The decision made without applause.</text><line x1="340" y1="210" x2="580" y2="255" stroke="#6060a0" stroke-width="1" opacity=".25" stroke-dasharray="4,3"/><line x1="860" y1="210" x2="620" y2="255" stroke="#6060a0" stroke-width="1" opacity=".25" stroke-dasharray="4,3"/><line x1="340" y1="385" x2="575" y2="355" stroke="#6060a0" stroke-width="1" opacity=".2" stroke-dasharray="4,3"/><line x1="860" y1="385" x2="625" y2="355" stroke="#6060a0" stroke-width="1" opacity=".2" stroke-dasharray="4,3"/><text x="600" y="510" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#8080b0" opacity=".5" font-style="italic">"The sacrifices that built something real are always invisible from the outside."</text></svg>