<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg"><defs><style>.bg{fill:#f4f0e8}.lbl{font-family:Georgia,serif;font-size:12px;fill:#4a3818}.n{font-family:Georgia,serif;font-size:24px;font-weight:bold;fill:#2a4060}@media(prefers-color-scheme:dark){.bg{fill:#0a0806}.lbl{fill:#c8b880}.n{fill:#4a70a0}}</style></defs><rect width="1200" height="600" class="bg"/><text x="600" y="55" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#2a4060" opacity=".7" font-weight="bold">Lessons that only the frontline teaches</text><rect x="80" y="80" width="490" height="90" rx="8" fill="#2a4060" opacity=".06" stroke="#2a4060" stroke-width="1"/><text x="120" y="108" class="n">01</text><text x="185" y="108" font-family="Georgia,serif" font-size="14" fill="#2a4060" font-weight="bold">Speed of decision compounds.</text><text x="120" y="132" class="lbl" fill="#2a4060" opacity=".75">The founder who decides in hours</text><text x="120" y="150" class="lbl" fill="#2a4060" opacity=".75">beats the one who decides in weeks.</text><rect x="630" y="80" width="490" height="90" rx="8" fill="#2a4060" opacity=".06" stroke="#2a4060" stroke-width="1"/><text x="670" y="108" class="n">02</text><text x="735" y="108" font-family="Georgia,serif" font-size="14" fill="#2a4060" font-weight="bold">Trust is the only real leverage.</text><text x="670" y="132" class="lbl" fill="#2a4060" opacity=".75">Every deal you close is built</text><text x="670" y="150" class="lbl" fill="#2a4060" opacity=".75">on accumulated credibility.</text><rect x="80" y="190" width="490" height="90" rx="8" fill="#2a4060" opacity=".06" stroke="#2a4060" stroke-width="1"/><text x="120" y="218" class="n">03</text><text x="185" y="218" font-family="Georgia,serif" font-size="14" fill="#2a4060" font-weight="bold">Clarity beats inspiration.</text><text x="120" y="242" class="lbl" fill="#2a4060" opacity=".75">A team that knows exactly what</text><text x="120" y="260" class="lbl" fill="#2a4060" opacity=".75">they're doing outperforms one that's motivated.</text><rect x="630" y="190" width="490" height="90" rx="8" fill="#2a4060" opacity=".06" stroke="#2a4060" stroke-width="1"/><text x="670" y="218" class="n">04</text><text x="735" y="218" font-family="Georgia,serif" font-size="14" fill="#2a4060" font-weight="bold">Cash solves problems. Time creates them.</text><text x="670" y="242" class="lbl" fill="#2a4060" opacity=".75">The most expensive asset</text><text x="670" y="260" class="lbl" fill="#2a4060" opacity=".75">a founder has is months of runway.</text><rect x="80" y="300" width="490" height="90" rx="8" fill="#2a4060" opacity=".05" stroke="#2a4060" stroke-width="1"/><text x="120" y="328" class="n">05</text><text x="185" y="328" font-family="Georgia,serif" font-size="14" fill="#2a4060" font-weight="bold">The first client is the hardest proof.</text><text x="120" y="352" class="lbl" fill="#2a4060" opacity=".75">Everything after is pattern matching.</text><text x="120" y="370" class="lbl" fill="#2a4060" opacity=".75">The first one is pure conviction.</text><rect x="630" y="300" width="490" height="90" rx="8" fill="#2a4060" opacity=".05" stroke="#2a4060" stroke-width="1"/><text x="670" y="328" class="n">06</text><text x="735" y="328" font-family="Georgia,serif" font-size="14" fill="#2a4060" font-weight="bold">Systems compound. Hustle decays.</text><text x="670" y="352" class="lbl" fill="#2a4060" opacity=".75">You cannot out-effort a broken system.</text><text x="670" y="370" class="lbl" fill="#2a4060" opacity=".75">Build the system.</text><text x="600" y="500" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#4a3818" opacity=".5" font-style="italic">"School teaches general principles. The frontline teaches specific truths."</text></svg>