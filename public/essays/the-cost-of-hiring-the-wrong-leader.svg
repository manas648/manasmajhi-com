<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg"><defs><style>.bg{fill:#f4f0e8}.lbl{font-family:Georgia,serif;font-size:11px;fill:#4a3818}@media(prefers-color-scheme:dark){.bg{fill:#0a0806}.lbl{fill:#c8b880}}</style></defs><rect width="1200" height="600" class="bg"/><text x="600" y="70" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#8a2010" font-weight="bold" opacity=".7">The Real Cost of a Wrong Executive Hire</text><rect x="120" y="110" width="300" height="60" rx="6" fill="#8a2010" opacity=".75"/><text x="270" y="136" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="white" font-weight="bold">Direct cost</text><text x="270" y="156" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#f8d8c8">20–30% of total CTC</text><rect x="120" y="190" width="300" height="60" rx="6" fill="#8a2010" opacity=".65"/><text x="270" y="216" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="white" font-weight="bold">Re-hire cost</text><text x="270" y="236" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#f8d8c8">Same fee again. Plus time.</text><rect x="120" y="270" width="300" height="60" rx="6" fill="#8a2010" opacity=".55"/><text x="270" y="296" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="white" font-weight="bold">Team disruption</text><text x="270" y="316" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#f8d8c8">3–6 months of momentum lost</text><rect x="120" y="350" width="300" height="60" rx="6" fill="#8a2010" opacity=".45"/><text x="270" y="376" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="white" font-weight="bold">Revenue impact</text><text x="270" y="396" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#f8d8c8">Missed targets. Pipeline stalled.</text><rect x="120" y="430" width="300" height="60" rx="6" fill="#8a2010" opacity=".35"/><text x="270" y="456" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="white" font-weight="bold">Culture damage</text><text x="270" y="476" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#f8d8c8">Attrition. Trust eroded.</text><line x1="480" y1="140" x2="600" y2="140" stroke="#8a2010" stroke-width="1.5" opacity=".4"/><line x1="480" y1="220" x2="600" y2="260" stroke="#8a2010" stroke-width="1.5" opacity=".4"/><line x1="480" y1="300" x2="600" y2="340" stroke="#8a2010" stroke-width="1.5" opacity=".35"/><line x1="480" y1="380" x2="600" y2="400" stroke="#8a2010" stroke-width="1.5" opacity=".3"/><line x1="480" y1="460" x2="600" y2="460" stroke="#8a2010" stroke-width="1.5" opacity=".25"/><rect x="600" y="100" width="460" height="400" rx="8" fill="#8a2010" opacity=".05" stroke="#8a2010" stroke-width="1.5"/><text x="830" y="190" text-anchor="middle" font-family="Georgia,serif" font-size="28" fill="#8a2010" opacity=".7" font-weight="bold">3–5×</text><text x="830" y="225" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#8a2010" opacity=".65">annual salary</text><text x="830" y="280" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#6a3010" opacity=".6">total cost of a</text><text x="830" y="305" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#6a3010" opacity=".6">failed executive hire</text><line x1="700" y1="340" x2="960" y2="340" stroke="#c8a870" stroke-width=".8" opacity=".3"/><text x="830" y="380" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#8a5030" opacity=".55" font-style="italic">Most companies never</text><text x="830" y="400" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#8a5030" opacity=".55" font-style="italic">calculate this number.</text></svg>