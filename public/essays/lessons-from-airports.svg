<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg"><defs><style>.bg{fill:#0a0c14}.lbl{font-family:Georgia,serif;font-size:12px;fill:#8090a8}@media(prefers-color-scheme:dark){.bg{fill:#050608}}</style></defs><rect width="1200" height="600" class="bg"/><rect x="80" y="200" width="1040" height="180" rx="4" fill="#141828" opacity=".9"/><rect x="80" y="200" width="1040" height="3" fill="#2a3050" opacity=".8"/><text x="120" y="240" font-family="Georgia,serif" font-size="13" fill="#a0b0c8" opacity=".7">DEPARTURES</text><rect x="120" y="255" width="720" height="18" rx="2" fill="#1e2840" opacity=".7"/><text x="130" y="269" font-family="Georgia,serif" font-size="10" fill="#c8d8f0">Singapore · SQ521 · 07:40 · Gate A14 · ON TIME</text><rect x="120" y="280" width="680" height="18" rx="2" fill="#1e2840" opacity=".5"/><text x="130" y="294" font-family="Georgia,serif" font-size="10" fill="#c8d8f0">Mumbai · AI301 · 09:15 · Gate B3 · BOARDING</text><rect x="120" y="305" width="700" height="18" rx="2" fill="#1e2840" opacity=".5"/><text x="130" y="319" font-family="Georgia,serif" font-size="10" fill="#c8d8f0">London · BA142 · 10:00 · Gate C22 · DELAYED</text><rect x="120" y="330" width="660" height="18" rx="2" fill="#1e2840" opacity=".4"/><text x="130" y="344" font-family="Georgia,serif" font-size="10" fill="#c8d8f0">Dubai · EK521 · 11:30 · Gate A7 · ON TIME</text><text x="600" y="130" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#8090a8" opacity=".65">Lessons from Airports</text><text x="200" y="460" text-anchor="middle" class="lbl" opacity=".5">Everyone here is in between.</text><text x="600" y="460" text-anchor="middle" class="lbl" opacity=".5">Going or arriving.</text><text x="1000" y="460" text-anchor="middle" class="lbl" opacity=".5">Hopeful or relieved.</text><text x="200" y="480" text-anchor="middle" class="lbl" opacity=".4" font-size="10">Leaving someone. Finding someone.</text><text x="600" y="480" text-anchor="middle" class="lbl" opacity=".4" font-size="10">The gate is just a threshold.</text><text x="1000" y="480" text-anchor="middle" class="lbl" opacity=".4" font-size="10">Same as every other door.</text><text x="600" y="548" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#5060a0" opacity=".5" font-style="italic">"Airports are where everyone is briefly equal. Stripped to carry-on and purpose."</text></svg>