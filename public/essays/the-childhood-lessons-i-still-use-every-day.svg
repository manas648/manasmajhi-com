<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg"><defs><style>.bg{fill:#f8f4ee}.cap{font-family:Georgia,serif;font-size:16px;font-weight:bold}.lbl{font-family:Georgia,serif;font-size:12px}@media(prefers-color-scheme:dark){.bg{fill:#0c0a06}}</style></defs><rect width="1200" height="600" class="bg"/><circle cx="200" cy="300" r="85" fill="#c86020" opacity=".12"/><rect x="168" y="240" width="64" height="28" rx="6" fill="#c86020" opacity=".7"/><rect x="190" y="264" width="20" height="70" rx="4" fill="#8a4010" opacity=".7"/><text x="200" y="432" text-anchor="middle" class="cap" fill="#c86020">Work</text><text x="200" y="452" text-anchor="middle" class="lbl" fill="#8a5020">before reward</text><circle cx="440" cy="300" r="85" fill="#2a5a8a" opacity=".12"/><path d="M405,235 L475,235 L440,300 L405,235Z" fill="#2a5a8a" opacity=".6"/><path d="M405,365 L475,365 L440,300 L405,365Z" fill="#2a5a8a" opacity=".4"/><line x1="400" y1="235" x2="480" y2="235" stroke="#2a5a8a" stroke-width="3" opacity=".7"/><line x1="400" y1="365" x2="480" y2="365" stroke="#2a5a8a" stroke-width="3" opacity=".7"/><text x="440" y="432" text-anchor="middle" class="cap" fill="#2a5a8a">Patience</text><text x="440" y="452" text-anchor="middle" class="lbl" fill="#1a4060">compounding</text><circle cx="680" cy="300" r="85" fill="#2a6a3a" opacity=".12"/><path d="M600,300 Q680,240 760,300 Q680,360 600,300Z" fill="none" stroke="#2a6a3a" stroke-width="3" opacity=".7"/><circle cx="680" cy="300" r="22" fill="#2a6a3a" opacity=".5"/><circle cx="680" cy="300" r="10" fill="#2a6a3a" opacity=".8"/><text x="680" y="432" text-anchor="middle" class="cap" fill="#2a6a3a">Observe</text><text x="680" y="452" text-anchor="middle" class="lbl" fill="#1a4a28">before speaking</text><circle cx="920" cy="300" r="85" fill="#6a4a1a" opacity=".12"/><path d="M920,355 L920,290 Q920,240 880,230 Q900,270 920,290 Q920,240 960,230 Q940,270 920,290" fill="#6a4a1a" opacity=".6"/><circle cx="920" cy="358" r="8" fill="#6a4a1a" opacity=".5"/><text x="920" y="432" text-anchor="middle" class="cap" fill="#6a4a1a">Frugality</text><text x="920" y="452" text-anchor="middle" class="lbl" fill="#4a2a10">seeds growth</text><text x="600" y="530" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#4a3818" opacity=".55" font-style="italic">"The most durable education happens before you know you are being educated."</text></svg>