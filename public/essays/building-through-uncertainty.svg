<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg"><defs><style>.bg{fill:#f4f0e8}.lbl{font-family:Georgia,serif;font-size:12px;fill:#4a3818}@media(prefers-color-scheme:dark){.bg{fill:#0a0806}.lbl{fill:#c8b880}}</style></defs><rect width="1200" height="600" class="bg"/><path d="M80,420 C150,380 160,350 200,310 C240,270 230,240 270,200 C310,160 320,180 360,155 C400,130 410,140 450,120 C490,100 500,115 540,100 C580,85 600,90 640,80 C680,70 700,85 740,75 C780,65 800,80 840,75 C880,70 900,85 940,80 C980,75 1000,90 1040,88 C1080,86 1100,92 1120,90" fill="none" stroke="#c8b880" stroke-width="2" stroke-dasharray="5,5" opacity=".5"/><path d="M80,420 C150,400 200,390 250,370 C300,350 350,320 400,300 C450,280 500,260 560,240 C620,220 680,200 740,185 C800,170 860,160 940,145 C990,136 1060,128 1120,120" fill="none" stroke="#2a5a3a" stroke-width="4" stroke-linecap="round" opacity=".8"/><circle cx="80" cy="420" r="10" fill="#8a6040" opacity=".7"/><text x="80" y="450" text-anchor="middle" class="lbl" opacity=".6">Start</text><circle cx="280" cy="355" r="8" fill="#c87020" opacity=".7"/><text x="280" y="342" text-anchor="middle" class="lbl" fill="#c87020">First</text><text x="280" y="327" text-anchor="middle" class="lbl" fill="#c87020" font-size="10">crisis</text><circle cx="480" cy="290" r="8" fill="#c87020" opacity=".7"/><text x="480" y="277" text-anchor="middle" class="lbl" fill="#c87020">Pivot</text><text x="480" y="262" text-anchor="middle" class="lbl" fill="#c87020" font-size="10">point</text><circle cx="700" cy="195" r="8" fill="#2a5a3a" opacity=".8"/><text x="700" y="182" text-anchor="middle" class="lbl" fill="#2a5a3a">Traction</text><circle cx="1000" cy="138" r="10" fill="#2a5a3a" opacity=".85"/><text x="1000" y="125" text-anchor="middle" class="lbl" fill="#2a5a3a">Now</text><rect x="80" y="100" width="340" height="60" rx="8" fill="#8a2010" opacity=".07" stroke="#8a2010" stroke-width="1"/><text x="250" y="122" text-anchor="middle" class="lbl" fill="#8a2010">The path you planned</text><text x="250" y="142" text-anchor="middle" class="lbl" fill="#8a2010" font-size="10" opacity=".7">(never follows the plan)</text><rect x="80" y="175" width="340" height="60" rx="8" fill="#2a5a3a" opacity=".1" stroke="#2a5a3a" stroke-width="1"/><text x="250" y="197" text-anchor="middle" class="lbl" fill="#2a5a3a">The path you actually took</text><text x="250" y="217" text-anchor="middle" class="lbl" fill="#2a5a3a" font-size="10" opacity=".7">(always makes more sense in hindsight)</text><text x="600" y="510" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#4a3818" opacity=".5" font-style="italic">"Uncertainty is not the enemy of building. It is the medium you build in."</text></svg>