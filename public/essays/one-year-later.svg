<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg"><defs><style>.bg{fill:#f4f0e8}.lbl{font-family:Georgia,serif;font-size:12px;fill:#4a3818}@media(prefers-color-scheme:dark){.bg{fill:#0a0806}.lbl{fill:#c8b880}}</style></defs><rect width="1200" height="600" class="bg"/><line x1="80" y1="300" x2="1120" y2="300" stroke="#c8b880" stroke-width="1.5" opacity=".3"/><circle cx="200" cy="300" r="10" fill="#c8b880" opacity=".5"/><text x="200" y="328" text-anchor="middle" class="lbl" opacity=".6">Jan</text><circle cx="360" cy="300" r="8" fill="#c8b880" opacity=".4"/><text x="360" y="328" text-anchor="middle" class="lbl" opacity=".5">Mar</text><circle cx="520" cy="300" r="8" fill="#c8b880" opacity=".4"/><text x="520" y="328" text-anchor="middle" class="lbl" opacity=".5">May</text><circle cx="680" cy="300" r="8" fill="#c8b880" opacity=".4"/><text x="680" y="328" text-anchor="middle" class="lbl" opacity=".5">Jul</text><circle cx="840" cy="300" r="8" fill="#c8b880" opacity=".4"/><text x="840" y="328" text-anchor="middle" class="lbl" opacity=".5">Sep</text><circle cx="1000" cy="300" r="12" fill="#2a5a3a" opacity=".8"/><text x="1000" y="328" text-anchor="middle" class="lbl" fill="#2a5a3a">One year.</text><rect x="140" y="160" width="160" height="80" rx="6" fill="#c8b880" opacity=".12"/><text x="220" y="185" text-anchor="middle" class="lbl" opacity=".6">The thing I was afraid of.</text><text x="220" y="205" text-anchor="middle" class="lbl" font-size="10" opacity=".45">Seems smaller now.</text><rect x="440" y="110" width="180" height="80" rx="6" fill="#c8b880" opacity=".12"/><text x="530" y="135" text-anchor="middle" class="lbl" opacity=".6">The thing I thought mattered.</text><text x="530" y="155" text-anchor="middle" class="lbl" font-size="10" opacity=".45">It didn't. Not really.</text><rect x="740" y="140" width="180" height="80" rx="6" fill="#2a5a3a" opacity=".1"/><text x="830" y="165" text-anchor="middle" class="lbl" fill="#2a5a3a" opacity=".7">The thing I almost skipped.</text><text x="830" y="185" text-anchor="middle" class="lbl" fill="#2a5a3a" font-size="10" opacity=".55">That one mattered most.</text><path d="M200,282 C280,260 380,250 480,220 C540,205 580,195 680,185" fill="none" stroke="#2a5a3a" stroke-width="2.5" stroke-linecap="round" opacity=".7"/><path d="M680,185 C800,175 900,195 1000,288" fill="none" stroke="#2a5a3a" stroke-width="2.5" stroke-linecap="round" opacity=".6"/><text x="600" y="490" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#4a3818" opacity=".5" font-style="italic">"The year always teaches something the month could not see."</text></svg>