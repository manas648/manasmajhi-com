="280" height="50" rx="6" fill="#8a2010" opacity=".12" stroke="#8a2010" stroke-width="1"/><text x="890" y="101" text-anchor="middle" class="lbl" fill="#8a2010">Pipeline runs dry.</text><text x="890" y="118" text-anchor="middle" class="lbl" fill="#8a2010">Best candidates decline. Nothing moves.</text><rect x="80" y="240" width="160" height="40" rx="4" fill="#2a5a3a" opacity=".12"/><text x="160" y="258" text-anchor="middle" class="lbl" fill="#2a5a3a">Market mapped</text><text x="160" y="272" text-anchor="middle" class="lbl" fill="#2a5a3a" font-size="9">Outreach live</text><rect x="380" y="210" width="160" height="40" rx="4" fill="#2a5a3a" opacity=".12"/><text x="460" y="228" text-anchor="middle" class="lbl" fill="#2a5a3a">Shortlist ready</text><text x="460" y="242" text-anchor="middle" class="lbl" fill="#2a5a3a" font-size="9">Interviews set</text><text x="600" y="530" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#4a3818" opacity=".5" font-style="italic">"68% of VP searches stall past week 10. Majhi OS detects it at week 7."</text></svg>