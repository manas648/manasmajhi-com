<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg"><defs><style>.bg{fill:#f4f0e8}.hdg{font-family:Georgia,serif;font-size:22px;font-weight:bold}.lbl{font-family:Georgia,serif;font-size:13px}@media(prefers-color-scheme:dark){.bg{fill:#0c0a06}}</style></defs><rect width="1200" height="600" class="bg"/><line x1="600" y1="60" x2="600" y2="540" stroke="#b8a888" stroke-width="1" stroke-dasharray="6,4"/><text x="300" y="100" text-anchor="middle" class="hdg" fill="#8a2010">Nationalism</text><line x1="120" y1="180" x2="520" y2="180" stroke="#8a2010" stroke-width="2.5" opacity=".7"/><line x1="120" y1="220" x2="520" y2="220" stroke="#8a2010" stroke-width="2" opacity=".5"/><line x1="160" y1="155" x2="160" y2="240" stroke="#8a2010" stroke-width="2.5" opacity=".7"/><line x1="220" y1="155" x2="220" y2="240" stroke="#8a2010" stroke-width="2.5" opacity=".7"/><line x1="280" y1="155" x2="280" y2="240" stroke="#8a2010" stroke-width="2.5" opacity=".7"/><line x1="340" y1="155" x2="340" y2="240" stroke="#8a2010" stroke-width="2.5" opacity=".7"/><line x1="400" y1="155" x2="400" y2="240" stroke="#8a2010" stroke-width="2.5" opacity=".7"/><line x1="460" y1="155" x2="460" y2="240" stroke="#8a2010" stroke-width="2.5" opacity=".7"/><line x1="300" y1="270" x2="300" y2="350" stroke="#8a2010" stroke-width="2" opacity=".6"/><polygon points="300,350 290,330 310,330" fill="#8a2010" opacity=".6"/><text x="300" y="395" text-anchor="middle" class="lbl" fill="#6a2010" font-size="14">Us vs Them</text><text x="300" y="420" text-anchor="middle" class="lbl" fill="#6a2010" font-size="12">Borders. Exclusion. Fear.</text><text x="300" y="445" text-anchor="middle" class="lbl" fill="#6a2010" font-size="12">Pride as superiority.</text><text x="300" y="470" text-anchor="middle" class="lbl" fill="#6a2010" font-size="12">Love that demands loyalty.</text><text x="900" y="100" text-anchor="middle" class="hdg" fill="#1a4a2a">Patriotism</text><line x1="900" y1="240" x2="900" y2="160" stroke="#1a4a2a" stroke-width="3" opacity=".7"/><line x1="900" y1="200" x2="840" y2="160" stroke="#1a4a2a" stroke-width="2" opacity=".6"/><line x1="900" y1="200" x2="960" y2="160" stroke="#1a4a2a" stroke-width="2" opacity=".6"/><circle cx="900" cy="150" r="18" fill="#1a4a2a" opacity=".35"/><circle cx="840" cy="150" r="14" fill="#1a4a2a" opacity=".3"/><circle cx="960" cy="150" r="14" fill="#1a4a2a" opacity=".3"/><line x1="900" y1="270" x2="900" y2="350" stroke="#1a4a2a" stroke-width="2" opacity=".6"/><polygon points="900,270 890,290 910,290" fill="#1a4a2a" opacity=".6"/><text x="900" y="395" text-anchor="middle" class="lbl" fill="#1a4a2a" font-size="14">Love without condition</text><text x="900" y="420" text-anchor="middle" class="lbl" fill="#1a4a2a" font-size="12">Roots. Belonging. Care.</text><text x="900" y="445" text-anchor="middle" class="lbl" fill="#1a4a2a" font-size="12">Pride as accountability.</text><text x="900" y="470" text-anchor="middle" class="lbl" fill="#1a4a2a" font-size="12">Love that demands honesty.</text><text x="600" y="520" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#6a5a40" font-style="italic" opacity=".7">"Both begin in love. Only one stays there."</text></svg>