<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg"><defs><style>.bg{fill:#f4f0e8}.lbl{font-family:Georgia,serif;font-size:11px;fill:#4a3818}@media(prefers-color-scheme:dark){.bg{fill:#0a0806}.lbl{fill:#c8b880}}</style></defs><rect width="1200" height="600" class="bg"/><text x="600" y="56" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#2a4060" opacity=".7" font-weight="bold">Every sector learns observability the same way: after the failure.</text><rect x="80" y="90" width="300" height="130" rx="8" fill="#2a4060" opacity=".08" stroke="#2a4060" stroke-width="1"/><text x="230" y="118" text-anchor="middle" class="lbl" fill="#2a4060" font-weight="bold">Software Ops</text><text x="230" y="138" text-anchor="middle" class="lbl" fill="#2a4060" opacity=".7">Systems failed in</text><text x="230" y="155" text-anchor="middle" class="lbl" fill="#2a4060" opacity=".7">production. Then they</text><text x="230" y="172" text-anchor="middle" class="lbl" fill="#2a4060" opacity=".7">built Datadog, PagerDuty.</text><text x="230" y="200" text-anchor="middle" class="lbl" fill="#2a4060" font-size="10" opacity=".55">Observability → standard</text><rect x="410" y="90" width="300" height="130" rx="8" fill="#8a3a10" opacity=".08" stroke="#8a3a10" stroke-width="1"/><text x="560" y="118" text-anchor="middle" class="lbl" fill="#8a3a10" font-weight="bold">Financial Services</text><text x="560" y="138" text-anchor="middle" class="lbl" fill="#8a3a10" opacity=".7">Trading desks collapsed.</text><text x="560" y="155" text-anchor="middle" class="lbl" fill="#8a3a10" opacity=".7">Then they built real-time</text><text x="560" y="172" text-anchor="middle" class="lbl" fill="#8a3a10" opacity=".7">risk monitoring.</text><text x="560" y="200" text-anchor="middle" class="lbl" fill="#8a3a10" font-size="10" opacity=".55">Now mandatory by regulators</text><rect x="740" y="90" width="300" height="130" rx="8" fill="#3a6020" opacity=".08" stroke="#3a6020" stroke-width="1"/><text x="890" y="118" text-anchor="middle" class="lbl" fill="#3a6020" font-weight="bold">Healthcare</text><text x="890" y="138" text-anchor="middle" class="lbl" fill="#3a6020" opacity=".7">Adverse events occurred.</text><text x="890" y="155" text-anchor="middle" class="lbl" fill="#3a6020" opacity=".7">Then they built patient</text><text x="890" y="172" text-anchor="middle" class="lbl" fill="#3a6020" opacity=".7">monitoring systems.</text><text x="890" y="200" text-anchor="middle" class="lbl" fill="#3a6020" font-size="10" opacity=".55">Now standard of care</text><rect x="80" y="250" width="300" height="130" rx="8" fill="#6a3a80" opacity=".07" stroke="#6a3a80" stroke-width="1"/><text x="230" y="278" text-anchor="middle" class="lbl" fill="#6a3a80" font-weight="bold">Supply Chain</text><text x="230" y="298" text-anchor="middle" class="lbl" fill="#6a3a80" opacity=".7">Disruptions revealed</text><text x="230" y="315" text-anchor="middle" class="lbl" fill="#6a3a80" opacity=".7">blind spots. Then they</text><text x="230" y="332" text-anchor="middle" class="lbl" fill="#6a3a80" opacity=".7">built control towers.</text><text x="230" y="360" text-anchor="middle" class="lbl" fill="#6a3a80" font-size="10" opacity=".55">End-to-end visibility now expected</text><rect x="410" y="250" width="300" height="130" rx="8" fill="#c87020" opacity=".08" stroke="#c87020" stroke-width="1"/><text x="560" y="278" text-anchor="middle" class="lbl" fill="#c87020" font-weight="bold">Cybersecurity</text><text x="560" y="298" text-anchor="middle" class="lbl" fill="#c87020" opacity=".7">Breaches happened.</text><text x="560" y="315" text-anchor="middle" class="lbl" fill="#c87020" opacity=".7">Then they built SIEM,</text><text x="560" y="332" text-anchor="middle" class="lbl" fill="#c87020" opacity=".7">threat intelligence layers.</text><text x="560" y="360" text-anchor="middle" class="lbl" fill="#c87020" font-size="10" opacity=".55">Zero-trust now baseline</text><rect x="740" y="250" width="300" height="130" rx="8" fill="#2a4060" opacity=".1" stroke="#2a4060" stroke-width="1.5"/><text x="890" y="278" text-anchor="middle" class="lbl" fill="#2a4060" font-weight="bold">Hiring — next</text><text x="890" y="298" text-anchor="middle" class="lbl" fill="#2a4060" opacity=".8">Mandates stall. Searches</text><text x="890" y="315" text-anchor="middle" class="lbl" fill="#2a4060" opacity=".8">fail. Now building hiring</text><text x="890" y="332" text-anchor="middle" class="lbl" fill="#2a4060" opacity=".8">system health layer.</text><text x="890" y="360" text-anchor="middle" class="lbl" fill="#2a4060" font-size="10" opacity=".7">Majhi OS — the infrastructure</text><text x="600" y="502" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#4a3818" opacity=".5" font-style="italic">"Every sector that matters has built observability. Hiring is next."</text></svg>