<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg"><defs><style>.bg{fill:#f4f0e8}.lbl{font-family:Georgia,serif;font-size:11px;fill:#4a3818}@media(prefers-color-scheme:dark){.bg{fill:#0a0806}.lbl{fill:#c8b880}}</style></defs><rect width="1200" height="600" class="bg"/><text x="600" y="62" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#8a2010" opacity=".75" font-weight="bold">$3,280/month in recruiting tools — itemised</text><rect x="80" y="90" width="680" height="42" rx="6" fill="#8a2010" opacity=".7"/><text x="440" y="108" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="white" font-weight="bold">LinkedIn Recruiter</text><text x="440" y="124" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#f8d8c8">$900/mo</text><rect x="80" y="144" width="560" height="40" rx="6" fill="#8a2010" opacity=".6"/><text x="360" y="160" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="white" font-weight="bold">ATS Platform</text><text x="360" y="176" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#f8d8c8">$750/mo</text><rect x="80" y="196" width="480" height="40" rx="6" fill="#8a2010" opacity=".5"/><text x="320" y="212" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="white" font-weight="bold">Data Enrichment</text><text x="320" y="228" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#f8d8c8">$580/mo</text><rect x="80" y="248" width="400" height="40" rx="6" fill="#8a2010" opacity=".4"/><text x="280" y="264" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="white" font-weight="bold">Email Sequencer</text><text x="280" y="280" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#f8d8c8">$380/mo</text><rect x="80" y="300" width="320" height="40" rx="6" fill="#8a2010" opacity=".32"/><text x="240" y="316" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="white" font-weight="bold">Calendar / Scheduling</text><text x="240" y="332" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#f8d8c8">$240/mo</text><rect x="80" y="352" width="260" height="40" rx="6" fill="#8a2010" opacity=".25"/><text x="210" y="368" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#8a2010" font-weight="bold">CRM</text><text x="210" y="384" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#8a2010">$230/mo</text><rect x="80" y="404" width="200" height="40" rx="6" fill="#8a2010" opacity=".2"/><text x="180" y="420" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#8a2010">Video</text><text x="180" y="436" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#8a2010">$200/mo</text><rect x="780" y="90" width="340" height="200" rx="10" fill="#2a5a3a" opacity=".1" stroke="#2a5a3a" stroke-width="1.5"/><text x="950" y="130" text-anchor="middle" font-family="Georgia,serif" font-size="28" fill="#2a5a3a" opacity=".8" font-weight="bold">$3,280</text><text x="950" y="158" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#2a5a3a" opacity=".65">per month</text><text x="950" y="200" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#8a5030">$39,360 / year</text><text x="950" y="225" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#8a5030" opacity=".7">on fragmented tools</text><text x="950" y="255" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#8a5030" opacity=".6">that don't talk to each other</text><rect x="780" y="320" width="340" height="90" rx="8" fill="#8a2010" opacity=".08" stroke="#8a2010" stroke-width="1"/><text x="950" y="350" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#8a2010" opacity=".7">None of this</text><text x="950" y="370" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#8a2010" opacity=".7">tells you why a mandate</text><text x="950" y="390" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#8a2010" opacity=".7">is about to stall.</text><text x="600" y="530" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#4a3818" opacity=".5" font-style="italic">"Tools are not infrastructure. Infrastructure is what connects them."</text></svg>