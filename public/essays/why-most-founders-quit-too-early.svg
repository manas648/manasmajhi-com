<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg"><defs><style>.bg{fill:#f4f0e8}.lbl{font-family:Georgia,serif;font-size:12px;fill:#4a3818}@media(prefers-color-scheme:dark){.bg{fill:#0a0806}.lbl{fill:#c8b880}}</style></defs><rect width="1200" height="600" class="bg"/><text x="600" y="58" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#8a2010" opacity=".7" font-weight="bold">The Valley of Doubt</text><line x1="80" y1="430" x2="1120" y2="430" stroke="#c8b880" stroke-width="1.5" opacity=".4"/><text x="80" y="455" text-anchor="middle" class="lbl" opacity=".5">Start</text><text x="1120" y="455" text-anchor="end" class="lbl" opacity=".5">Breakthrough</text><path d="M80,200 C160,210 220,250 300,310 C380,370 420,410 500,415 C560,418 580,412 620,390 C680,360 760,290 900,200 C980,155 1040,130 1120,110" fill="none" stroke="#c8b880" stroke-width="2" stroke-dasharray="6,4" opacity=".4"/><path d="M80,200 C160,210 220,250 300,310 C380,370 420,415 500,418" fill="none" stroke="#2a5a3a" stroke-width="4" stroke-linecap="round" opacity=".8"/><path d="M500,418 C560,420 580,418 620,395 C680,360 760,290 900,200 C980,155 1040,130 1120,110" fill="none" stroke="#2a5a3a" stroke-width="2" stroke-linecap="round" opacity=".3" stroke-dasharray="6,4"/><circle cx="500" cy="418" r="14" fill="#8a2010" opacity=".8"/><text x="500" y="415" text-anchor="middle" font-family="Georgia,serif" font-size="8" fill="white">QUIT</text><text x="500" y="425" text-anchor="middle" font-family="Georgia,serif" font-size="7" fill="white">ZONE</text><line x1="500" y1="418" x2="500" y2="380" stroke="#8a2010" stroke-width="1.5" stroke-dasharray="4,3" opacity=".7"/><rect x="400" y="320" width="200" height="50" rx="6" fill="#8a2010" opacity=".1" stroke="#8a2010" stroke-width="1"/><text x="500" y="340" text-anchor="middle" class="lbl" fill="#8a2010">Most quit here.</text><text x="500" y="358" text-anchor="middle" class="lbl" fill="#8a2010" font-size="10" opacity=".7">One quarter from the turn.</text><circle cx="80" cy="200" r="10" fill="#2a5a3a" opacity=".7"/><text x="80" y="185" text-anchor="middle" class="lbl" fill="#2a5a3a">Launch</text><circle cx="1120" cy="110" r="10" fill="#2a5a3a" opacity=".8"/><text x="1120" y="95" text-anchor="end" class="lbl" fill="#2a5a3a">Breakthrough</text><text x="600" y="510" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#4a3818" opacity=".5" font-style="italic">"The valley of doubt is a feature. Most quit inside it. That is the whole game."</text></svg>