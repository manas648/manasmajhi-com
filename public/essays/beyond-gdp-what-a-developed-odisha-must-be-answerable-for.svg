<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
<defs>
  <style>
    .bg{fill:#f5f0e8}.bar{fill:#c85a10}.human{fill:#1a4a6a}.arm{fill:none;stroke:#8a7a60;stroke-width:3;stroke-linecap:round}.pan{fill:none;stroke:#8a7a60;stroke-width:2}.chain{fill:none;stroke:#8a7a60;stroke-width:1.5;stroke-dasharray:4,3}.lbl{font-family:Georgia,serif;font-size:14px;fill:#3a2a18}.lbl-sm{font-family:Georgia,serif;font-size:11px;fill:#6a5040;font-style:italic}
    @media(prefers-color-scheme:dark){.bg{fill:#0c0a06}.bar{fill:#d07030}.human{fill:#4080b0}.lbl{fill:#d8c8a8}.lbl-sm{fill:#a08868}.arm{stroke:#504030}.pan{stroke:#504030}.chain{stroke:#504030}}
  </style>
</defs>
<rect width="1200" height="600" class="bg"/>
<!-- Fulcrum -->
<polygon points="600,380 570,440 630,440" fill="#8a7a60" opacity=".7"/>
<rect x="540" y="438" width="120" height="12" rx="3" fill="#8a7a60" opacity=".6"/>
<!-- Beam — tilted left (GDP side down) -->
<line x1="200" y1="310" x2="1000" y2="270" class="arm"/>
<!-- Left pan chains -->
<line x1="280" y1="316" x2="280" y2="360" class="chain"/>
<line x1="320" y1="313" x2="320" y2="360" class="chain"/>
<rect x="220" y="360" width="150" height="60" rx="6" class="pan"/>
<!-- GDP bars in left pan -->
<rect x="236" y="388" width="22" height="32" class="bar"/>
<rect x="266" y="375" width="22" height="45" class="bar"/>
<rect x="296" y="365" width="22" height="55" class="bar"/>
<rect x="326" y="380" width="22" height="40" class="bar"/>
<text x="295" y="438" text-anchor="middle" class="lbl" font-size="12">GDP</text>
<!-- Right pan chains -->
<line x1="880" y1="274" x2="880" y2="340" class="chain"/>
<line x1="920" y1="272" x2="920" y2="340" class="chain"/>
<rect x="830" y="340" width="150" height="80" rx="6" class="pan"/>
<!-- Human icons in right pan -->
<circle cx="860" cy="358" r="8" class="human" opacity=".8"/>
<line x1="860" y1="366" x2="860" y2="390" stroke="#1a4a6a" stroke-width="3" opacity=".7"/>
<circle cx="900" cy="355" r="8" class="human" opacity=".85"/>
<line x1="900" y1="363" x2="900" y2="387" stroke="#1a4a6a" stroke-width="3" opacity=".75"/>
<circle cx="940" cy="358" r="8" class="human" opacity=".8"/>
<line x1="940" y1="366" x2="940" y2="390" stroke="#1a4a6a" stroke-width="3" opacity=".7"/>
<!-- Book icon -->
<rect x="855" y="392" width="24" height="18" rx="2" fill="#3a6a40" opacity=".7"/>
<!-- Tree -->
<circle cx="926" cy="396" r="10" fill="#3a6a40" opacity=".7"/>
<line x1="926" y1="406" x2="926" y2="416" stroke="#3a6a40" stroke-width="2"/>
<text x="905" y="436" text-anchor="middle" class="lbl" font-size="12">Human metrics</text>
<!-- Labels -->
<text x="600" y="490" text-anchor="middle" class="lbl-sm">"A developed Odisha must be answerable for more than its growth rate."</text>
</svg>