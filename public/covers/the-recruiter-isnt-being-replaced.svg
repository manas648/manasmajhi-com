<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg"><defs><style>.bg{fill:#f4f0e8}.lbl{font-family:Georgia,serif;font-size:12px;fill:#4a3818}@media(prefers-color-scheme:dark){.bg{fill:#0a0806}.lbl{fill:#c8b880}}</style></defs><rect width="1200" height="600" class="bg"/><line x1="600" y1="80" x2="600" y2="520" stroke="#c8b880" stroke-width="1" stroke-dasharray="6,4" opacity=".4"/><text x="300" y="80" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#8a2010" font-weight="bold">AI Replaces</text><text x="900" y="80" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#2a5a3a" font-weight="bold">Recruiter Owns</text><rect x="80" y="104" width="440" height="40" rx="6" fill="#8a2010" opacity=".12"/><text x="300" y="130" text-anchor="middle" class="lbl" fill="#8a2010">Resume parsing and ranking</text><rect x="80" y="156" width="440" height="40" rx="6" fill="#8a2010" opacity=".12"/><text x="300" y="182" text-anchor="middle" class="lbl" fill="#8a2010">Boolean search and sourcing lists</text><rect x="80" y="208" width="440" height="40" rx="6" fill="#8a2010" opacity=".1"/><text x="300" y="234" text-anchor="middle" class="lbl" fill="#8a2010">Draft outreach and follow-up</text><rect x="80" y="260" width="440" height="40" rx="6" fill="#8a2010" opacity=".1"/><text x="300" y="286" text-anchor="middle" class="lbl" fill="#8a2010">CRM data entry and hygiene</text><rect x="80" y="312" width="440" height="40" rx="6" fill="#8a2010" opacity=".08"/><text x="300" y="338" text-anchor="middle" class="lbl" fill="#8a2010">Interview scheduling and coordination</text><rect x="80" y="364" width="440" height="40" rx="6" fill="#8a2010" opacity=".08"/><text x="300" y="390" text-anchor="middle" class="lbl" fill="#8a2010">Pattern matching in candidate data</text><rect x="680" y="104" width="440" height="40" rx="6" fill="#2a5a3a" opacity=".12"/><text x="900" y="130" text-anchor="middle" class="lbl" fill="#2a5a3a">Trust and confidentiality</text><rect x="680" y="156" width="440" height="40" rx="6" fill="#2a5a3a" opacity=".12"/><text x="900" y="182" text-anchor="middle" class="lbl" fill="#2a5a3a">Reading the room in interviews</text><rect x="680" y="208" width="440" height="40" rx="6" fill="#2a5a3a" opacity=".1"/><text x="900" y="234" text-anchor="middle" class="lbl" fill="#2a5a3a">Stakeholder alignment and politics</text><rect x="680" y="260" width="440" height="40" rx="6" fill="#2a5a3a" opacity=".1"/><text x="900" y="286" text-anchor="middle" class="lbl" fill="#2a5a3a">Motivating passive candidates</text><rect x="680" y="312" width="440" height="40" rx="6" fill="#2a5a3a" opacity=".1"/><text x="900" y="338" text-anchor="middle" class="lbl" fill="#2a5a3a">Negotiating the close</text><rect x="680" y="364" width="440" height="40" rx="6" fill="#2a5a3a" opacity=".1"/><text x="900" y="390" text-anchor="middle" class="lbl" fill="#2a5a3a">Judgment on culture and fit</text><rect x="680" y="416" width="440" height="40" rx="6" fill="#2a5a3a" opacity=".1"/><text x="900" y="442" text-anchor="middle" class="lbl" fill="#2a5a3a">Navigating internal org dynamics</text><text x="600" y="510" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#4a3818" opacity=".5" font-style="italic">"AI makes the recruiter 10x more effective. It does not make them unnecessary."</text></svg>