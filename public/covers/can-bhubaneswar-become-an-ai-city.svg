<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
<defs>
  <style>
    .bg{fill:#060e1e}.grid-line{stroke:#0e2040;stroke-width:.8}.node-n{fill:#4090e0;opacity:.8}.node-lit{fill:#60b8ff}.conn{fill:none;stroke:#2060a0;stroke-width:1;opacity:.6}.build{fill:#0e2848}.build-lit{fill:#1a3a68}.glow{fill:#4090e0;opacity:.15}
    @media(prefers-color-scheme:dark){.bg{fill:#030810}}
  </style>
</defs>
<rect width="1200" height="600" class="bg"/>
<!-- City grid lines -->
<line x1="0" y1="150" x2="1200" y2="150" class="grid-line"/>
<line x1="0" y1="250" x2="1200" y2="250" class="grid-line"/>
<line x1="0" y1="350" x2="1200" y2="350" class="grid-line"/>
<line x1="0" y1="450" x2="1200" y2="450" class="grid-line"/>
<line x1="150" y1="0" x2="150" y2="600" class="grid-line"/>
<line x1="350" y1="0" x2="350" y2="600" class="grid-line"/>
<line x1="550" y1="0" x2="550" y2="600" class="grid-line"/>
<line x1="750" y1="0" x2="750" y2="600" class="grid-line"/>
<line x1="950" y1="0" x2="950" y2="600" class="grid-line"/>
<line x1="1150" y1="0" x2="1150" y2="600" class="grid-line"/>
<!-- Buildings -->
<rect x="160" y="280" width="80" height="170" class="build"/><rect x="160" y="280" width="80" height="170" class="build-lit" opacity=".4"/>
<rect x="260" y="220" width="70" height="230" class="build"/>
<rect x="360" y="190" width="90" height="260" class="build"/><rect x="360" y="190" width="90" height="260" class="build-lit" opacity=".3"/>
<rect x="470" y="250" width="60" height="200" class="build"/>
<rect x="560" y="160" width="100" height="290" class="build"/><rect x="560" y="160" width="100" height="290" class="build-lit" opacity=".5"/>
<rect x="680" y="210" width="55" height="240" class="build"/>
<rect x="755" y="170" width="85" height="280" class="build"/><rect x="755" y="170" width="85" height="280" class="build-lit" opacity=".35"/>
<rect x="860" y="240" width="75" height="210" class="build"/>
<rect x="955" y="200" width="90" height="250" class="build"/><rect x="955" y="200" width="90" height="250" class="build-lit" opacity=".3"/>
<rect x="1065" y="270" width="65" height="180" class="build"/>
<!-- Building windows — glowing dots -->
<circle cx="180" cy="310" r="2.5" class="node-lit" opacity=".6"/><circle cx="200" cy="310" r="2.5" class="node-lit" opacity=".5"/><circle cx="220" cy="310" r="2.5" class="node-lit" opacity=".7"/>
<circle cx="180" cy="340" r="2.5" class="node-lit" opacity=".5"/><circle cx="200" cy="340" r="2.5" class="node-lit" opacity=".8"/><circle cx="220" cy="340" r="2.5" class="node-lit" opacity=".4"/>
<circle cx="380" cy="220" r="2.5" class="node-lit" opacity=".7"/><circle cx="400" cy="220" r="2.5" class="node-lit" opacity=".6"/><circle cx="420" cy="220" r="2.5" class="node-lit" opacity=".8"/><circle cx="440" cy="220" r="2.5" class="node-lit" opacity=".5"/>
<circle cx="380" cy="250" r="2.5" class="node-lit" opacity=".6"/><circle cx="400" cy="250" r="2.5" class="node-lit" opacity=".9"/><circle cx="420" cy="250" r="2.5" class="node-lit" opacity=".7"/>
<circle cx="575" cy="190" r="2.5" class="node-lit" opacity=".8"/><circle cx="595" cy="190" r="2.5" class="node-lit" opacity=".7"/><circle cx="615" cy="190" r="2.5" class="node-lit" opacity=".9"/><circle cx="635" cy="190" r="2.5" class="node-lit" opacity=".6"/>
<circle cx="575" cy="215" r="2.5" class="node-lit" opacity=".7"/><circle cx="595" cy="215" r="2.5" class="node-lit" opacity=".8"/><circle cx="615" cy="215" r="2.5" class="node-lit" opacity=".6"/><circle cx="635" cy="215" r="2.5" class="node-lit" opacity=".9"/>
<!-- Neural network overlay — top portion -->
<circle cx="300" cy="60" r="6" class="node-n"/><circle cx="500" cy="40" r="7" class="node-n"/><circle cx="700" cy="55" r="6" class="node-n"/><circle cx="900" cy="45" r="7" class="node-n"/><circle cx="150" cy="80" r="5" class="node-n" opacity=".6"/><circle cx="1050" cy="70" r="5" class="node-n" opacity=".6"/>
<line x1="300" y1="60" x2="500" y2="40" class="conn"/><line x1="500" y1="40" x2="700" y2="55" class="conn"/><line x1="700" y1="55" x2="900" y2="45" class="conn"/><line x1="300" y1="60" x2="150" y2="80" class="conn" opacity=".4"/><line x1="900" y1="45" x2="1050" y2="70" class="conn" opacity=".4"/><line x1="300" y1="60" x2="700" y2="55" class="conn" opacity=".3"/><line x1="500" y1="40" x2="900" y2="45" class="conn" opacity=".3"/>
<!-- Glow halos over key buildings -->
<ellipse cx="610" cy="165" rx="55" ry="20" class="glow"/>
<ellipse cx="797" cy="175" rx="45" ry="18" class="glow"/>
</svg>