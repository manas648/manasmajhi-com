<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg"><defs><style>.bg{fill:#f4f0e8}.lbl{font-family:Georgia,serif;font-size:12px;fill:#4a3818}@media(prefers-color-scheme:dark){.bg{fill:#0a0806}.lbl{fill:#c8b880}}</style></defs><rect width="1200" height="600" class="bg"/><text x="600" y="58" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#2a4060" opacity=".7" font-weight="bold">What automation cannot replace</text><rect x="180" y="90" width="840" height="56" rx="8" fill="#2a4060" opacity=".07"/><text x="600" y="118" text-anchor="middle" class="lbl" fill="#2a4060" opacity=".65">Automation replaces tasks. It does not replace judgment, trust, or meaning.</text><text x="600" y="136" text-anchor="middle" class="lbl" fill="#2a4060" opacity=".55" font-size="10">The error is confusing "automatable" with "replaceable".</text><rect x="80" y="170" width="300" height="100" rx="8" fill="#2a5a3a" opacity=".1" stroke="#2a5a3a" stroke-width="1"/><text x="230" y="198" text-anchor="middle" class="lbl" fill="#2a5a3a" font-weight="bold">Contextual judgment</text><text x="230" y="218" text-anchor="middle" class="lbl" fill="#2a5a3a" opacity=".7">Knowing when the</text><text x="230" y="236" text-anchor="middle" class="lbl" fill="#2a5a3a" opacity=".7">rule should bend.</text><rect x="410" y="170" width="300" height="100" rx="8" fill="#2a5a3a" opacity=".1" stroke="#2a5a3a" stroke-width="1"/><text x="560" y="198" text-anchor="middle" class="lbl" fill="#2a5a3a" font-weight="bold">Earned trust</text><text x="560" y="218" text-anchor="middle" class="lbl" fill="#2a5a3a" opacity=".7">Relationships built over</text><text x="560" y="236" text-anchor="middle" class="lbl" fill="#2a5a3a" opacity=".7">time and kept promises.</text><rect x="740" y="170" width="300" height="100" rx="8" fill="#2a5a3a" opacity=".1" stroke="#2a5a3a" stroke-width="1"/><text x="890" y="198" text-anchor="middle" class="lbl" fill="#2a5a3a" font-weight="bold">Meaning-making</text><text x="890" y="218" text-anchor="middle" class="lbl" fill="#2a5a3a" opacity=".7">Why this work matters</text><text x="890" y="236" text-anchor="middle" class="lbl" fill="#2a5a3a" opacity=".7">to the people doing it.</text><rect x="80" y="300" width="300" height="100" rx="8" fill="#2a5a3a" opacity=".08" stroke="#2a5a3a" stroke-width="1"/><text x="230" y="328" text-anchor="middle" class="lbl" fill="#2a5a3a" font-weight="bold">Creative courage</text><text x="230" y="348" text-anchor="middle" class="lbl" fill="#2a5a3a" opacity=".7">Making the call no one</text><text x="230" y="366" text-anchor="middle" class="lbl" fill="#2a5a3a" opacity=".7">else is willing to make.</text><rect x="410" y="300" width="300" height="100" rx="8" fill="#2a5a3a" opacity=".08" stroke="#2a5a3a" stroke-width="1"/><text x="560" y="328" text-anchor="middle" class="lbl" fill="#2a5a3a" font-weight="bold">Accountability</text><text x="560" y="348" text-anchor="middle" class="lbl" fill="#2a5a3a" opacity=".7">Owning the outcome</text><text x="560" y="366" text-anchor="middle" class="lbl" fill="#2a5a3a" opacity=".7">whether good or bad.</text><rect x="740" y="300" width="300" height="100" rx="8" fill="#2a5a3a" opacity=".08" stroke="#2a5a3a" stroke-width="1"/><text x="890" y="328" text-anchor="middle" class="lbl" fill="#2a5a3a" font-weight="bold">Presence</text><text x="890" y="348" text-anchor="middle" class="lbl" fill="#2a5a3a" opacity=".7">Being actually there</text><text x="890" y="366" text-anchor="middle" class="lbl" fill="#2a5a3a" opacity=".7">for someone who needs it.</text><text x="600" y="506" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#4a3818" opacity=".5" font-style="italic">"The highest-leverage human skills become more valuable as automation rises."</text></svg>