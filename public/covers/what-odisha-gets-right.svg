<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg"><defs><style>.bg{fill:#f4f0e8}.lbl{font-family:Georgia,serif;font-size:13px;fill:#1a3a22}@media(prefers-color-scheme:dark){.bg{fill:#060906}.lbl{fill:#90c898}}</style></defs><rect width="1200" height="600" class="bg"/><rect x="120" y="120" width="420" height="80" rx="8" fill="#2a5a3a" opacity=".85"/><text x="330" y="155" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#e8f8e8" font-weight="bold">Disaster preparedness</text><text x="330" y="178" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#b8d8b8">World-class cyclone response system</text><line x1="178" y1="155" x2="135" y2="155" stroke="#f5f0e0" stroke-width="3" stroke-linecap="round" opacity=".8"/><polyline points="135,145 125,155 135,165" fill="none" stroke="#f5f0e0" stroke-width="3" stroke-linecap="round" opacity=".8"/><rect x="120" y="230" width="420" height="80" rx="8" fill="#2a5a3a" opacity=".8"/><text x="330" y="265" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#e8f8e8" font-weight="bold">Cultural preservation</text><text x="330" y="288" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#b8d8b8">Jagannath, Konark, classical arts, Odia language</text><line x1="178" y1="265" x2="135" y2="265" stroke="#f5f0e0" stroke-width="3" stroke-linecap="round" opacity=".8"/><polyline points="135,255 125,265 135,275" fill="none" stroke="#f5f0e0" stroke-width="3" stroke-linecap="round" opacity=".8"/><rect x="120" y="340" width="420" height="80" rx="8" fill="#2a5a3a" opacity=".75"/><text x="330" y="375" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#e8f8e8" font-weight="bold">Mineral stewardship</text><text x="330" y="398" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#b8d8b8">Coal, iron, bauxite — largest reserves in India</text><line x1="178" y1="375" x2="135" y2="375" stroke="#f5f0e0" stroke-width="3" stroke-linecap="round" opacity=".8"/><polyline points="135,365 125,375 135,385" fill="none" stroke="#f5f0e0" stroke-width="3" stroke-linecap="round" opacity=".8"/><rect x="660" y="120" width="420" height="80" rx="8" fill="#2a5a3a" opacity=".85"/><text x="870" y="155" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#e8f8e8" font-weight="bold">Tribal rights framework</text><text x="870" y="178" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#b8d8b8">PESA implementation + forest rights</text><line x1="818" y1="155" x2="775" y2="155" stroke="#f5f0e0" stroke-width="3" stroke-linecap="round" opacity=".8"/><polyline points="775,145 765,155 775,165" fill="none" stroke="#f5f0e0" stroke-width="3" stroke-linecap="round" opacity=".8"/><rect x="660" y="230" width="420" height="80" rx="8" fill="#2a5a3a" opacity=".8"/><text x="870" y="265" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#e8f8e8" font-weight="bold">Steel and manufacturing</text><text x="870" y="288" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#b8d8b8">Rourkela — industrial anchor of eastern India</text><line x1="818" y1="265" x2="775" y2="265" stroke="#f5f0e0" stroke-width="3" stroke-linecap="round" opacity=".8"/><polyline points="775,255 765,265 775,275" fill="none" stroke="#f5f0e0" stroke-width="3" stroke-linecap="round" opacity=".8"/><rect x="660" y="340" width="420" height="80" rx="8" fill="#2a5a3a" opacity=".75"/><text x="870" y="375" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#e8f8e8" font-weight="bold">Coastline + ports</text><text x="870" y="398" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#b8d8b8">480km coast, Paradip — gateway to the east</text><line x1="818" y1="375" x2="775" y2="375" stroke="#f5f0e0" stroke-width="3" stroke-linecap="round" opacity=".8"/><polyline points="775,365 765,375 775,385" fill="none" stroke="#f5f0e0" stroke-width="3" stroke-linecap="round" opacity=".8"/><text x="600" y="510" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#1a3a22" opacity=".5" font-style="italic">"Strength is easier to build on than regret."</text></svg>