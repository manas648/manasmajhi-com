<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg"><defs><style>.bg{fill:#f4f0e8}.lbl{font-family:Georgia,serif;font-size:12px;fill:#4a3818}@media(prefers-color-scheme:dark){.bg{fill:#0a0806}.lbl{fill:#c8b880}}</style></defs><rect width="1200" height="600" class="bg"/><rect x="180" y="100" width="840" height="90" rx="10" fill="#2a4060" opacity=".07" stroke="#2a4060" stroke-width="1.5"/><text x="600" y="138" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#2a4060" opacity=".75" font-style="italic">"What am I actually building?"</text><text x="600" y="170" text-anchor="middle" class="lbl" fill="#2a4060" opacity=".55">Not the product. The thing behind it.</text><line x1="600" y1="220" x2="600" y2="480" stroke="#c8b880" stroke-width="1" stroke-dasharray="5,4" opacity=".4"/><rect x="80" y="230" width="440" height="60" rx="8" fill="#c87020" opacity=".1" stroke="#c87020" stroke-width="1"/><text x="300" y="255" text-anchor="middle" class="lbl" fill="#c87020">Surface answer: an executive search firm.</text><text x="300" y="275" text-anchor="middle" class="lbl" fill="#c87020" font-size="10" opacity=".6">And autonomous hiring infrastructure.</text><rect x="680" y="230" width="440" height="60" rx="8" fill="#2a5a3a" opacity=".1" stroke="#2a5a3a" stroke-width="1"/><text x="900" y="255" text-anchor="middle" class="lbl" fill="#2a5a3a">Deeper answer: proof that origin does not</text><text x="900" y="275" text-anchor="middle" class="lbl" fill="#2a5a3a">determine destination.</text><rect x="80" y="320" width="440" height="60" rx="8" fill="#c87020" opacity=".08" stroke="#c87020" stroke-width="1"/><text x="300" y="345" text-anchor="middle" class="lbl" fill="#c87020">What I tell investors:</text><text x="300" y="365" text-anchor="middle" class="lbl" fill="#c87020" font-size="10" opacity=".6">A platform that prevents hiring systems from failing.</text><rect x="680" y="320" width="440" height="60" rx="8" fill="#2a5a3a" opacity=".1" stroke="#2a5a3a" stroke-width="1"/><text x="900" y="345" text-anchor="middle" class="lbl" fill="#2a5a3a">What I know it is:</text><text x="900" y="365" text-anchor="middle" class="lbl" fill="#2a5a3a" font-size="10" opacity=".6">Operational intelligence for organizations that cannot afford to stall.</text><rect x="80" y="410" width="440" height="60" rx="8" fill="#c87020" opacity=".06" stroke="#c87020" stroke-width="1"/><text x="300" y="435" text-anchor="middle" class="lbl" fill="#c87020">What it will be:</text><text x="300" y="455" text-anchor="middle" class="lbl" fill="#c87020" font-size="10" opacity=".6">The hiring system health category. A new layer of infrastructure.</text><rect x="680" y="410" width="440" height="60" rx="8" fill="#2a5a3a" opacity=".08" stroke="#2a5a3a" stroke-width="1"/><text x="900" y="435" text-anchor="middle" class="lbl" fill="#2a5a3a">What drives it:</text><text x="900" y="455" text-anchor="middle" class="lbl" fill="#2a5a3a" font-size="10" opacity=".6">The belief that broken hiring blocks opportunity. For everyone.</text></svg>