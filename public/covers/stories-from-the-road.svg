<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg"><defs><style>.bg{fill:#f4f0e8}.lbl{font-family:Georgia,serif;font-size:12px;fill:#4a3818}@media(prefers-color-scheme:dark){.bg{fill:#0a0806}.lbl{fill:#c8b880}}</style></defs><rect width="1200" height="600" class="bg"/><path d="M80,520 Q200,480 280,420 Q360,360 400,320 Q440,280 520,240 Q600,200 640,170 Q700,140 760,130 Q840,120 920,140 Q1000,160 1080,180 Q1100,186 1120,190" fill="none" stroke="#c8b880" stroke-width="2.5" stroke-linecap="round" opacity=".5"/><circle cx="200" cy="475" r="10" fill="#c87020" opacity=".75"/><text x="200" y="460" text-anchor="middle" class="lbl" fill="#c87020">Odisha</text><circle cx="400" cy="315" r="8" fill="#2a5a3a" opacity=".7"/><text x="400" y="300" text-anchor="middle" class="lbl" fill="#2a5a3a">Kuala Lumpur</text><circle cx="520" cy="238" r="8" fill="#2a5a3a" opacity=".7"/><text x="520" y="223" text-anchor="middle" class="lbl" fill="#2a5a3a">Langkawi</text><circle cx="640" cy="170" r="8" fill="#2a5a3a" opacity=".7"/><text x="640" y="155" text-anchor="middle" class="lbl" fill="#2a5a3a">Singapore</text><circle cx="760" cy="130" r="8" fill="#2a4060" opacity=".7"/><text x="760" y="115" text-anchor="middle" class="lbl" fill="#2a4060">Dubai</text><circle cx="920" cy="140" r="8" fill="#2a4060" opacity=".7"/><text x="920" y="125" text-anchor="middle" class="lbl" fill="#2a4060">London</text><circle cx="1080" cy="180" r="10" fill="#2a4060" opacity=".7"/><text x="1080" y="165" text-anchor="middle" class="lbl" fill="#2a4060">New York</text><rect x="80" y="110" width="320" height="70" rx="8" fill="#c8b880" opacity=".1"/><text x="240" y="133" text-anchor="middle" class="lbl" opacity=".6">"The food you share with a stranger</text><text x="240" y="151" text-anchor="middle" class="lbl" opacity=".6">is always the best meal you had."</text><text x="240" y="169" text-anchor="middle" class="lbl" opacity=".4" font-size="10">— somewhere in Malaysia</text><rect x="800" y="200" width="320" height="70" rx="8" fill="#c8b880" opacity=".1"/><text x="960" y="223" text-anchor="middle" class="lbl" opacity=".6">"Every city has the same 2 AM.</text><text x="960" y="241" text-anchor="middle" class="lbl" opacity=".6">Only the language changes."</text><text x="960" y="259" text-anchor="middle" class="lbl" opacity=".4" font-size="10">— cab driver, Singapore</text><text x="600" y="530" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#4a3818" opacity=".5" font-style="italic">"The road does not teach geography. It teaches people."</text></svg>