<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg"><defs><style>.bg{fill:#f4f0e8}.lbl{font-family:Georgia,serif;font-size:12px;fill:#4a3818}@media(prefers-color-scheme:dark){.bg{fill:#0a0806}.lbl{fill:#c8b880}}</style></defs><rect width="1200" height="600" class="bg"/><circle cx="600" cy="270" r="140" fill="none" stroke="#c8a030" stroke-width="1.5" opacity=".4"/><circle cx="600" cy="270" r="100" fill="#c8a030" opacity=".04"/><text x="600" y="266" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#c87020" font-weight="bold">The table</text><text x="600" y="284" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#c87020" opacity=".7">where everything happens</text><circle cx="350" cy="140" r="18" fill="#2a5a3a" opacity=".7"/><text x="350" y="118" text-anchor="middle" class="lbl" fill="#2a5a3a">Memory</text><text x="350" y="134" text-anchor="middle" class="lbl" fill="#2a5a3a" font-size="10" opacity=".7">what you ate at 8</text><circle cx="600" cy="100" r="18" fill="#2a5a3a" opacity=".7"/><text x="600" y="78" text-anchor="middle" class="lbl" fill="#2a5a3a">Identity</text><text x="600" y="94" text-anchor="middle" class="lbl" fill="#2a5a3a" font-size="10" opacity=".7">what your people eat</text><circle cx="850" cy="140" r="18" fill="#2a5a3a" opacity=".7"/><text x="850" y="118" text-anchor="middle" class="lbl" fill="#2a5a3a">Culture</text><text x="850" y="134" text-anchor="middle" class="lbl" fill="#2a5a3a" font-size="10" opacity=".7">how it is prepared</text><circle cx="980" cy="290" r="18" fill="#2a5a3a" opacity=".7"/><text x="1005" y="285" class="lbl" fill="#2a5a3a">Trust</text><text x="1005" y="300" class="lbl" fill="#2a5a3a" font-size="10" opacity=".7">sharing a meal</text><circle cx="900" cy="420" r="18" fill="#2a5a3a" opacity=".65"/><text x="900" y="450" text-anchor="middle" class="lbl" fill="#2a5a3a">Celebration</text><text x="900" y="465" text-anchor="middle" class="lbl" fill="#2a5a3a" font-size="10" opacity=".7">every milestone</text><circle cx="600" cy="460" r="18" fill="#2a5a3a" opacity=".65"/><text x="600" y="492" text-anchor="middle" class="lbl" fill="#2a5a3a">Grief</text><text x="600" y="507" text-anchor="middle" class="lbl" fill="#2a5a3a" font-size="10" opacity=".7">food after loss</text><circle cx="300" cy="420" r="18" fill="#2a5a3a" opacity=".65"/><text x="300" y="450" text-anchor="middle" class="lbl" fill="#2a5a3a">Connection</text><text x="300" y="465" text-anchor="middle" class="lbl" fill="#2a5a3a" font-size="10" opacity=".7">cooking together</text><circle cx="218" cy="290" r="18" fill="#2a5a3a" opacity=".7"/><text x="100" y="285" text-anchor="middle" class="lbl" fill="#2a5a3a">Hospitality</text><text x="100" y="300" text-anchor="middle" class="lbl" fill="#2a5a3a" font-size="10" opacity=".7">the first offering</text><line x1="364" y1="152" x2="500" y2="262" stroke="#c8a030" stroke-width="1" opacity=".3"/><line x1="600" y1="112" x2="600" y2="248" stroke="#c8a030" stroke-width="1" opacity=".3"/><line x1="836" y1="152" x2="700" y2="262" stroke="#c8a030" stroke-width="1" opacity=".3"/><line x1="965" y1="296" x2="722" y2="274" stroke="#c8a030" stroke-width="1" opacity=".3"/><line x1="884" y1="410" x2="710" y2="300" stroke="#c8a030" stroke-width="1" opacity=".3"/><line x1="600" y1="450" x2="600" y2="352" stroke="#c8a030" stroke-width="1" opacity=".3"/><line x1="316" y1="410" x2="490" y2="300" stroke="#c8a030" stroke-width="1" opacity=".3"/><line x1="232" y1="296" x2="480" y2="270" stroke="#c8a030" stroke-width="1" opacity=".3"/><text x="600" y="564" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#4a3818" opacity=".5" font-style="italic">"You learn more about a place from its food than from its monuments."</text></svg>