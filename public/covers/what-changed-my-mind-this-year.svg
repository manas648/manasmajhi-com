<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg"><defs><style>.bg{fill:#f4f0e8}.lbl{font-family:Georgia,serif;font-size:12px;fill:#4a3818}@media(prefers-color-scheme:dark){.bg{fill:#0a0806}.lbl{fill:#c8b880}}</style></defs><rect width="1200" height="600" class="bg"/><text x="600" y="60" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#c87020" opacity=".75" font-weight="bold">Beliefs updated this year</text><rect x="80" y="90" width="1040" height="64" rx="8" fill="#2a5a3a" opacity=".08" stroke="#2a5a3a" stroke-width="1"/><text x="140" y="118" class="lbl" fill="#8a4010" font-weight="bold">Before:</text><text x="220" y="118" class="lbl" fill="#8a4010" opacity=".8">"Speed is the primary advantage in executive search."</text><text x="140" y="143" class="lbl" fill="#2a5a3a" font-weight="bold">After:</text><text x="200" y="143" class="lbl" fill="#2a5a3a" opacity=".8">"Precision is. Speed is a byproduct of operating well."</text><rect x="80" y="170" width="1040" height="64" rx="8" fill="#2a5a3a" opacity=".06" stroke="#2a5a3a" stroke-width="1"/><text x="140" y="198" class="lbl" fill="#8a4010" font-weight="bold">Before:</text><text x="220" y="198" class="lbl" fill="#8a4010" opacity=".8">"AI will replace most recruiting work within 3 years."</text><text x="140" y="223" class="lbl" fill="#2a5a3a" font-weight="bold">After:</text><text x="200" y="223" class="lbl" fill="#2a5a3a" opacity=".8">"AI eliminates the mechanical work and amplifies the relationship work."</text><rect x="80" y="250" width="1040" height="64" rx="8" fill="#2a5a3a" opacity=".05" stroke="#2a5a3a" stroke-width="1"/><text x="140" y="278" class="lbl" fill="#8a4010" font-weight="bold">Before:</text><text x="220" y="278" class="lbl" fill="#8a4010" opacity=".8">"Brand drives outbound response rates."</text><text x="140" y="303" class="lbl" fill="#2a5a3a" font-weight="bold">After:</text><text x="200" y="303" class="lbl" fill="#2a5a3a" opacity=".8">"Specificity drives response. Brand just lowers skepticism."</text><rect x="80" y="330" width="1040" height="64" rx="8" fill="#2a5a3a" opacity=".05" stroke="#2a5a3a" stroke-width="1"/><text x="140" y="358" class="lbl" fill="#8a4010" font-weight="bold">Before:</text><text x="220" y="358" class="lbl" fill="#8a4010" opacity=".8">"Hiring is a talent problem."</text><text x="140" y="383" class="lbl" fill="#2a5a3a" font-weight="bold">After:</text><text x="200" y="383" class="lbl" fill="#2a5a3a" opacity=".8">"Hiring is a systems problem. Talent is rarely the constraint."</text><text x="600" y="500" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#4a3818" opacity=".5" font-style="italic">"Updating your beliefs is not weakness. It is the whole point."</text></svg>