<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg"><defs><style>.bg{fill:#f4f0e8}.lbl{font-family:Georgia,serif;font-size:12px;fill:#4a3818}@media(prefers-color-scheme:dark){.bg{fill:#0a0806}.lbl{fill:#c8b880}}</style></defs><rect width="1200" height="600" class="bg"/><text x="600" y="60" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#2a4060" opacity=".75" font-weight="bold">The Single Most Useful Hiring Question</text><rect x="180" y="100" width="840" height="100" rx="10" fill="#2a4060" opacity=".08" stroke="#2a4060" stroke-width="1.5"/><text x="600" y="148" text-anchor="middle" font-family="Georgia,serif" font-size="28" fill="#2a4060" opacity=".75" font-style="italic">"Have they done this before?"</text><text x="600" y="178" text-anchor="middle" class="lbl" fill="#2a4060" opacity=".6">Not something similar. This. Exactly.</text><rect x="80" y="240" width="480" height="56" rx="8" fill="#8a2010" opacity=".08" stroke="#8a2010" stroke-width="1"/><text x="320" y="263" text-anchor="middle" class="lbl" fill="#8a2010">What most companies ask:</text><text x="320" y="285" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#8a2010" opacity=".8" font-style="italic">"Do they look qualified?"</text><rect x="640" y="240" width="480" height="56" rx="8" fill="#2a5a3a" opacity=".1" stroke="#2a5a3a" stroke-width="1"/><text x="880" y="263" text-anchor="middle" class="lbl" fill="#2a5a3a">What great operators ask:</text><text x="880" y="285" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#2a5a3a" opacity=".8" font-style="italic">"Have they done this specific thing?"</text><line x1="100" y1="350" x2="1100" y2="350" stroke="#c8b880" stroke-width=".8" opacity=".4"/><text x="600" y="395" text-anchor="middle" class="lbl" opacity=".6">The CV tells you where they worked.</text><text x="600" y="418" text-anchor="middle" class="lbl" opacity=".6">The brief tells you what the role actually requires.</text><text x="600" y="441" text-anchor="middle" class="lbl" opacity=".6">The gap between those two questions is where most executive hires go wrong.</text><text x="600" y="530" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#4a3818" opacity=".5" font-style="italic">"Pattern recognition beats pedigree every time."</text></svg>