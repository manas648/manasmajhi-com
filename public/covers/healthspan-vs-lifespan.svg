<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg"><defs><style>.bg{fill:#f4f0e8}.lbl{font-family:Georgia,serif;font-size:11px;fill:#4a3818}@media(prefers-color-scheme:dark){.bg{fill:#0a0806}.lbl{fill:#c8b880}}</style></defs><rect width="1200" height="600" class="bg"/><text x="600" y="60" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#2a5a3a" opacity=".75" font-weight="bold">Healthspan vs Lifespan</text><line x1="80" y1="380" x2="1120" y2="380" stroke="#c8b880" stroke-width="1.5" opacity=".4"/><text x="80" y="400" class="lbl" opacity=".6">Birth</text><text x="1120" y="400" text-anchor="end" class="lbl" opacity=".6">Death</text><path d="M80,320 C200,290 350,240 500,220 C620,205 720,210 800,240 C880,265 950,310 1040,340 Q1080,355 1120,360" fill="none" stroke="#8a2010" stroke-width="2.5" stroke-dasharray="8,4" stroke-linecap="round" opacity=".6"/><text x="860" y="215" class="lbl" fill="#8a2010">Lifespan (how long you live)</text><path d="M80,320 C200,290 350,240 500,220 C620,205 720,210 760,220" fill="none" stroke="#2a5a3a" stroke-width="4" stroke-linecap="round" opacity=".85"/><path d="M760,220 C820,240 880,300 950,350 Q1050,390 1120,400" fill="none" stroke="#2a5a3a" stroke-width="2" stroke-linecap="round" opacity=".3"/><text x="400" y="200" text-anchor="middle" class="lbl" fill="#2a5a3a">Healthspan (how well you live)</text><line x1="760" y1="380" x2="760" y2="215" stroke="#c87020" stroke-width="1.5" stroke-dasharray="4,3" opacity=".6"/><text x="760" y="175" text-anchor="middle" class="lbl" fill="#c87020">Divergence point</text><rect x="160" y="100" width="400" height="56" rx="6" fill="#2a5a3a" opacity=".08" stroke="#2a5a3a" stroke-width="1"/><text x="360" y="122" text-anchor="middle" class="lbl" fill="#2a5a3a">The goal: push the divergence right.</text><text x="360" y="142" text-anchor="middle" class="lbl" fill="#2a5a3a" opacity=".7">More years where the lines overlap.</text><text x="600" y="490" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#4a3818" opacity=".5" font-style="italic">"Most people optimize for lifespan. The better question: for how many years are you fully alive?"</text></svg>