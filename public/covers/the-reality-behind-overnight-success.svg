<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg"><defs><style>.bg{fill:#f4f0e8}.lbl{font-family:Georgia,serif;font-size:12px;fill:#4a3818}@media(prefers-color-scheme:dark){.bg{fill:#0a0806}.lbl{fill:#c8b880}}</style></defs><rect width="1200" height="600" class="bg"/><text x="600" y="58" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#2a4060" opacity=".7" font-weight="bold">The "overnight success" timeline</text><line x1="80" y1="380" x2="1120" y2="380" stroke="#c8b880" stroke-width="1.5" opacity=".4"/><line x1="80" y1="375" x2="80" y2="385" stroke="#c8b880" stroke-width="2"/><text x="80" y="402" text-anchor="middle" class="lbl" opacity=".5">Year 1</text><line x1="280" y1="375" x2="280" y2="385" stroke="#c8b880" stroke-width="1.5" opacity=".5"/><text x="280" y="402" text-anchor="middle" class="lbl" opacity=".5">Year 2</text><line x1="480" y1="375" x2="480" y2="385" stroke="#c8b880" stroke-width="1.5" opacity=".5"/><text x="480" y="402" text-anchor="middle" class="lbl" opacity=".5">Year 3</text><line x1="680" y1="375" x2="680" y2="385" stroke="#c8b880" stroke-width="1.5" opacity=".5"/><text x="680" y="402" text-anchor="middle" class="lbl" opacity=".5">Year 4</text><line x1="880" y1="375" x2="880" y2="385" stroke="#8a2010" stroke-width="2"/><text x="880" y="402" text-anchor="middle" class="lbl" fill="#8a2010">Year 5</text><text x="880" y="418" text-anchor="middle" class="lbl" fill="#8a2010" font-size="10">"overnight"</text><line x1="1120" y1="375" x2="1120" y2="385" stroke="#c8b880" stroke-width="1.5" opacity=".5"/><path d="M80,368 C100,365 150,362 200,360 C250,358 280,355 320,350 C360,345 400,338 440,330 C480,322 520,310 560,295 C600,280 640,260 680,235 C720,210 760,180 800,155 C840,130 860,118 880,110" fill="none" stroke="#c8b880" stroke-width="2" opacity=".3" stroke-dasharray="4,4"/><path d="M880,110 C920,95 980,80 1040,70 C1080,62 1100,58 1120,55" fill="none" stroke="#2a5a3a" stroke-width="3.5" stroke-linecap="round" opacity=".85"/><circle cx="880" cy="110" r="12" fill="#2a5a3a" opacity=".8"/><text x="880" y="96" text-anchor="middle" class="lbl" fill="#2a5a3a" font-size="10">The moment</text><text x="880" y="82" text-anchor="middle" class="lbl" fill="#2a5a3a" font-size="10">everyone sees</text><rect x="80" y="155" width="240" height="80" rx="6" fill="#c8b880" opacity=".1"/><text x="200" y="178" text-anchor="middle" class="lbl" opacity=".6">Rejected by 6 firms.</text><text x="200" y="196" text-anchor="middle" class="lbl" opacity=".6">Near zero. Kept going.</text><text x="200" y="214" text-anchor="middle" class="lbl" font-size="10" opacity=".45">Year 1</text><rect x="360" y="180" width="240" height="80" rx="6" fill="#c8b880" opacity=".1"/><text x="480" y="203" text-anchor="middle" class="lbl" opacity=".6">First clients. Inconsistent.</text><text x="480" y="221" text-anchor="middle" class="lbl" opacity=".6">Refining the system.</text><text x="480" y="239" text-anchor="middle" class="lbl" font-size="10" opacity=".45">Year 2-3</text><text x="600" y="510" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#4a3818" opacity=".5" font-style="italic">"Overnight success is always a 5-year story told in a single headline."</text></svg>