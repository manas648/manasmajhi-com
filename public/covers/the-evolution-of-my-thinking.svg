<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg"><defs><style>.bg{fill:#f4f0e8}.lbl{font-family:Georgia,serif;font-size:11px;fill:#4a3818}@media(prefers-color-scheme:dark){.bg{fill:#0a0806}.lbl{fill:#c8b880}}</style></defs><rect width="1200" height="600" class="bg"/><path d="M80,400 Q300,380 380,320 Q440,275 500,260" fill="none" stroke="#c8b880" stroke-width="2" opacity=".4"/><path d="M500,260 Q560,245 620,210 Q700,170 800,155 Q900,140 1000,120 Q1060,110 1120,100" fill="none" stroke="#2a5a3a" stroke-width="3" stroke-linecap="round" opacity=".8"/><circle cx="80" cy="400" r="8" fill="#8a6040" opacity=".7"/><text x="80" y="428" text-anchor="middle" class="lbl" opacity=".6">Early beliefs</text><text x="80" y="443" text-anchor="middle" class="lbl" font-size="9" opacity=".5">confident and simple</text><circle cx="220" cy="385" r="7" fill="#8a6040" opacity=".6"/><text x="220" y="413" text-anchor="middle" class="lbl" opacity=".55">First failures</text><circle cx="380" cy="320" r="8" fill="#c87020" opacity=".7"/><text x="380" y="348" text-anchor="middle" class="lbl" fill="#c87020">Complexity surfaces</text><circle cx="500" cy="260" r="8" fill="#c87020" opacity=".7"/><text x="500" y="288" text-anchor="middle" class="lbl" fill="#c87020">Old models break</text><circle cx="650" cy="195" r="9" fill="#2a5a3a" opacity=".8"/><text x="650" y="175" text-anchor="middle" class="lbl" fill="#2a5a3a">Nuance replaces certainty</text><circle cx="840" cy="155" r="9" fill="#2a5a3a" opacity=".8"/><text x="840" y="135" text-anchor="middle" class="lbl" fill="#2a5a3a">Frameworks become portable</text><circle cx="1060" cy="112" r="10" fill="#2a5a3a" opacity=".9"/><text x="1060" y="92" text-anchor="middle" class="lbl" fill="#2a5a3a">Current — still updating</text><text x="600" y="510" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#4a3818" opacity=".5" font-style="italic">"The willingness to be wrong is what makes you right over time."</text></svg>