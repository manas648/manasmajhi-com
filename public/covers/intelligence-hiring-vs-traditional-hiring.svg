<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg"><defs><style>.bg{fill:#f4f0e8}.lbl{font-family:Georgia,serif;font-size:12px}@media(prefers-color-scheme:dark){.bg{fill:#0a0806}}</style></defs><rect width="1200" height="600" class="bg"/><line x1="600" y1="60" x2="600" y2="530" stroke="#c8b880" stroke-width="1" stroke-dasharray="6,4" opacity=".4"/><text x="300" y="78" text-anchor="middle" font-family="Georgia,serif" font-size="17" fill="#8a4010" font-weight="bold">Traditional Hiring</text><text x="900" y="78" text-anchor="middle" font-family="Georgia,serif" font-size="17" fill="#2a4a8a" font-weight="bold">Intelligence Hiring</text><rect x="80" y="100" width="440" height="42" rx="6" fill="#8a4010" opacity=".12"/><text x="300" y="120" text-anchor="middle" class="lbl" fill="#8a4010">Post and pray. Wait for inbound.</text><text x="300" y="136" text-anchor="middle" class="lbl" fill="#8a4010" font-size="10" opacity=".7">Reactive</text><rect x="80" y="154" width="440" height="42" rx="6" fill="#8a4010" opacity=".12"/><text x="300" y="174" text-anchor="middle" class="lbl" fill="#8a4010">CV as primary signal. Gut feel.</text><text x="300" y="190" text-anchor="middle" class="lbl" fill="#8a4010" font-size="10" opacity=".7">Backward-looking</text><rect x="80" y="208" width="440" height="42" rx="6" fill="#8a4010" opacity=".1"/><text x="300" y="228" text-anchor="middle" class="lbl" fill="#8a4010">Speed vs quality tradeoff.</text><text x="300" y="244" text-anchor="middle" class="lbl" fill="#8a4010" font-size="10" opacity=".7">Zero-sum</text><rect x="80" y="262" width="440" height="42" rx="6" fill="#8a4010" opacity=".1"/><text x="300" y="282" text-anchor="middle" class="lbl" fill="#8a4010">No data. Decisions on feel.</text><text x="300" y="298" text-anchor="middle" class="lbl" fill="#8a4010" font-size="10" opacity=".7">Opaque</text><rect x="80" y="316" width="440" height="42" rx="6" fill="#8a4010" opacity=".08"/><text x="300" y="336" text-anchor="middle" class="lbl" fill="#8a4010">Process ends at offer accepted.</text><text x="300" y="352" text-anchor="middle" class="lbl" fill="#8a4010" font-size="10" opacity=".7">No attribution</text><rect x="80" y="370" width="440" height="42" rx="6" fill="#8a4010" opacity=".08"/><text x="300" y="390" text-anchor="middle" class="lbl" fill="#8a4010">Hiring manager owns everything.</text><text x="300" y="406" text-anchor="middle" class="lbl" fill="#8a4010" font-size="10" opacity=".7">Bottleneck</text><rect x="680" y="100" width="440" height="42" rx="6" fill="#2a4a8a" opacity=".15"/><text x="900" y="120" text-anchor="middle" class="lbl" fill="#2a4a8a">Built pipeline before need. Proactive.</text><text x="900" y="136" text-anchor="middle" class="lbl" fill="#2a4a8a" font-size="10" opacity=".7">Anticipatory</text><rect x="680" y="154" width="440" height="42" rx="6" fill="#2a4a8a" opacity=".15"/><text x="900" y="174" text-anchor="middle" class="lbl" fill="#2a4a8a">Evidence dossier. Structured signal.</text><text x="900" y="190" text-anchor="middle" class="lbl" fill="#2a4a8a" font-size="10" opacity=".7">Forward-looking</text><rect x="680" y="208" width="440" height="42" rx="6" fill="#2a4a8a" opacity=".15"/><text x="900" y="228" text-anchor="middle" class="lbl" fill="#2a4a8a">Speed and quality together.</text><text x="900" y="244" text-anchor="middle" class="lbl" fill="#2a4a8a" font-size="10" opacity=".7">Compounding</text><rect x="680" y="262" width="440" height="42" rx="6" fill="#2a4a8a" opacity=".15"/><text x="900" y="282" text-anchor="middle" class="lbl" fill="#2a4a8a">Real-time mandate health data.</text><text x="900" y="298" text-anchor="middle" class="lbl" fill="#2a4a8a" font-size="10" opacity=".7">Observable</text><rect x="680" y="316" width="440" height="42" rx="6" fill="#2a4a8a" opacity=".15"/><text x="900" y="336" text-anchor="middle" class="lbl" fill="#2a4a8a">Attribution: cost saved, velocity, ROI.</text><text x="900" y="352" text-anchor="middle" class="lbl" fill="#2a4a8a" font-size="10" opacity=".7">Measurable</text><rect x="680" y="370" width="440" height="42" rx="6" fill="#2a4a8a" opacity=".13"/><text x="900" y="390" text-anchor="middle" class="lbl" fill="#2a4a8a">System executes. Humans decide.</text><text x="900" y="406" text-anchor="middle" class="lbl" fill="#2a4a8a" font-size="10" opacity=".7">Infrastructure</text><text x="600" y="510" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#4a3818" opacity=".5" font-style="italic">"The gap between them is not tools. It is operating model."</text></svg>