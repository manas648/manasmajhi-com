<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg"><defs><style>.bg{fill:#f4f0e8}.lbl{font-family:Georgia,serif;font-size:12px;fill:#4a3818}@media(prefers-color-scheme:dark){.bg{fill:#0a0806}.lbl{fill:#c8b880}}</style></defs><rect width="1200" height="600" class="bg"/><text x="600" y="56" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#2a4060" opacity=".7" font-weight="bold">The Next Decade of Work — Five Forces</text><rect x="80" y="90" width="460" height="90" rx="8" fill="#2a4060" opacity=".08" stroke="#2a4060" stroke-width="1"/><text x="310" y="118" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#2a4060" font-weight="bold">01 — AI as co-worker</text><text x="310" y="142" text-anchor="middle" class="lbl" fill="#2a4060" opacity=".75">Not replacement. Augmentation.</text><text x="310" y="160" text-anchor="middle" class="lbl" fill="#2a4060" opacity=".65" font-size="10">Every knowledge worker gains leverage.</text><rect x="660" y="90" width="460" height="90" rx="8" fill="#2a5a3a" opacity=".08" stroke="#2a5a3a" stroke-width="1"/><text x="890" y="118" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#2a5a3a" font-weight="bold">02 — Distributed by default</text><text x="890" y="142" text-anchor="middle" class="lbl" fill="#2a5a3a" opacity=".75">Geography is no longer a constraint.</text><text x="890" y="160" text-anchor="middle" class="lbl" fill="#2a5a3a" opacity=".65" font-size="10">Talent competes globally from anywhere.</text><rect x="80" y="210" width="460" height="90" rx="8" fill="#8a3a10" opacity=".07" stroke="#8a3a10" stroke-width="1"/><text x="310" y="238" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#8a3a10" font-weight="bold">03 — Operational intelligence rises</text><text x="310" y="262" text-anchor="middle" class="lbl" fill="#8a3a10" opacity=".75">Systems that manage work, not just track it.</text><text x="310" y="280" text-anchor="middle" class="lbl" fill="#8a3a10" opacity=".65" font-size="10">Observability becomes standard.</text><rect x="660" y="210" width="460" height="90" rx="8" fill="#6a3a80" opacity=".07" stroke="#6a3a80" stroke-width="1"/><text x="890" y="238" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#6a3a80" font-weight="bold">04 — Skills over credentials</text><text x="890" y="262" text-anchor="middle" class="lbl" fill="#6a3a80" opacity=".75">What you can do beats where you studied.</text><text x="890" y="280" text-anchor="middle" class="lbl" fill="#6a3a80" opacity=".65" font-size="10">Continuous learning becomes the moat.</text><rect x="260" y="330" width="680" height="90" rx="8" fill="#c87020" opacity=".08" stroke="#c87020" stroke-width="1"/><text x="600" y="358" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#c87020" font-weight="bold">05 — The talent-opportunity gap shrinks</text><text x="600" y="382" text-anchor="middle" class="lbl" fill="#c87020" opacity=".75">For the first time in history, where you start matters less.</text><text x="600" y="400" text-anchor="middle" class="lbl" fill="#c87020" opacity=".65" font-size="10">Infrastructure is the equaliser.</text><text x="600" y="510" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#4a3818" opacity=".5" font-style="italic">"The next decade belongs to those who understand how work changes — not just what work looks like."</text></svg>