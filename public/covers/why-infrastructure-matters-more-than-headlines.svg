<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg"><defs><style>.bg{fill:#f4f0e8}.lbl{font-family:Georgia,serif;font-size:12px}@media(prefers-color-scheme:dark){.bg{fill:#0a0806}.lbl{fill:#c8b888}}</style></defs><rect width="1200" height="600" class="bg"/><line x1="600" y1="80" x2="600" y2="530" stroke="#b8a880" stroke-width="1" stroke-dasharray="6,4" opacity=".5"/><text x="300" y="75" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#3a6030" font-weight="bold">Infrastructure</text><text x="900" y="75" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#8a2010" font-weight="bold">Headlines</text><g transform="translate(100,100)"><rect x="0" y="0" width="380" height="55" rx="6" fill="#3a6030" opacity=".2" stroke="#3a6030" stroke-width="1.5"/><text x="190" y="24" text-anchor="middle" class="lbl" fill="#3a6030" font-weight="bold">Road built</text><text x="190" y="42" text-anchor="middle" class="lbl" fill="#3a6030">Farmers reach markets. Incomes rise.</text></g><g transform="translate(100,180)"><rect x="0" y="0" width="380" height="55" rx="6" fill="#3a6030" opacity=".2" stroke="#3a6030" stroke-width="1.5"/><text x="190" y="24" text-anchor="middle" class="lbl" fill="#3a6030" font-weight="bold">School built</text><text x="190" y="42" text-anchor="middle" class="lbl" fill="#3a6030">Girls stay in school. Life outcomes shift.</text></g><g transform="translate(100,260)"><rect x="0" y="0" width="380" height="55" rx="6" fill="#3a6030" opacity=".2" stroke="#3a6030" stroke-width="1.5"/><text x="190" y="24" text-anchor="middle" class="lbl" fill="#3a6030" font-weight="bold">Power grid connected</text><text x="190" y="42" text-anchor="middle" class="lbl" fill="#3a6030">Businesses open. Labour leaves poverty.</text></g><g transform="translate(100,340)"><rect x="0" y="0" width="380" height="55" rx="6" fill="#3a6030" opacity=".2" stroke="#3a6030" stroke-width="1.5"/><text x="190" y="24" text-anchor="middle" class="lbl" fill="#3a6030" font-weight="bold">Digital connectivity</text><text x="190" y="42" text-anchor="middle" class="lbl" fill="#3a6030">Young people access information and capital.</text></g><g transform="translate(720,100)"><rect x="0" y="0" width="380" height="55" rx="6" fill="#8a2010" opacity=".12" stroke="#8a2010" stroke-width="1.5" stroke-dasharray="6,4"/><text x="190" y="24" text-anchor="middle" class="lbl" fill="#8a2010" font-weight="bold">Policy announced</text><text x="190" y="42" text-anchor="middle" class="lbl" fill="#8a2010">No budget. No timeline. No follow-up.</text></g><g transform="translate(720,180)"><rect x="0" y="0" width="380" height="55" rx="6" fill="#8a2010" opacity=".12" stroke="#8a2010" stroke-width="1.5" stroke-dasharray="6,4"/><text x="190" y="24" text-anchor="middle" class="lbl" fill="#8a2010" font-weight="bold">Scheme launched</text><text x="190" y="42" text-anchor="middle" class="lbl" fill="#8a2010">Subsidy paid. Nothing structurally changes.</text></g><g transform="translate(720,260)"><rect x="0" y="0" width="380" height="55" rx="6" fill="#8a2010" opacity=".12" stroke="#8a2010" stroke-width="1.5" stroke-dasharray="6,4"/><text x="190" y="24" text-anchor="middle" class="lbl" fill="#8a2010" font-weight="bold">Ribbon cut</text><text x="190" y="42" text-anchor="middle" class="lbl" fill="#8a2010">Lasts one news cycle. Forgotten by Tuesday.</text></g><text x="600" y="530" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#4a3818" opacity=".55" font-style="italic">"Infrastructure is boring. That is exactly why it works."</text></svg>