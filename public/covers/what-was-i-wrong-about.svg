<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg"><defs><style>.bg{fill:#f4f0e8}.lbl{font-family:Georgia,serif;font-size:12px;fill:#4a3818}@media(prefers-color-scheme:dark){.bg{fill:#0a0806}.lbl{fill:#c8b880}}</style></defs><rect width="1200" height="600" class="bg"/><text x="600" y="60" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#2a4060" opacity=".7" font-weight="bold">What I was wrong about</text><line x1="600" y1="90" x2="600" y2="490" stroke="#c8b880" stroke-width="1" stroke-dasharray="5,4" opacity=".4"/><rect x="80" y="100" width="420" height="50" rx="6" fill="#8a2010" opacity=".12"/><text x="290" y="120" text-anchor="middle" class="lbl" fill="#8a2010">Working harder = better outcomes.</text><text x="290" y="138" text-anchor="middle" class="lbl" fill="#8a2010" font-size="10" opacity=".7">Wrong. Direction matters more than effort.</text><rect x="700" y="100" width="420" height="50" rx="6" fill="#2a5a3a" opacity=".1"/><text x="910" y="120" text-anchor="middle" class="lbl" fill="#2a5a3a">Now: Leverage over volume. Always.</text><rect x="80" y="168" width="420" height="50" rx="6" fill="#8a2010" opacity=".12"/><text x="290" y="188" text-anchor="middle" class="lbl" fill="#8a2010">Success would bring certainty.</text><text x="290" y="206" text-anchor="middle" class="lbl" fill="#8a2010" font-size="10" opacity=".7">Wrong. It just raises the stakes of doubt.</text><rect x="700" y="168" width="420" height="50" rx="6" fill="#2a5a3a" opacity=".1"/><text x="910" y="188" text-anchor="middle" class="lbl" fill="#2a5a3a">Now: Clarity comes from doing, not arriving.</text><rect x="80" y="236" width="420" height="50" rx="6" fill="#8a2010" opacity=".1"/><text x="290" y="256" text-anchor="middle" class="lbl" fill="#8a2010">Resources = unfair advantage.</text><text x="290" y="274" text-anchor="middle" class="lbl" fill="#8a2010" font-size="10" opacity=".7">Wrong. Constraint forces creativity. Often.</text><rect x="700" y="236" width="420" height="50" rx="6" fill="#2a5a3a" opacity=".1"/><text x="910" y="256" text-anchor="middle" class="lbl" fill="#2a5a3a">Now: Context creates constraints, not fate.</text><rect x="80" y="304" width="420" height="50" rx="6" fill="#8a2010" opacity=".08"/><text x="290" y="324" text-anchor="middle" class="lbl" fill="#8a2010">Consensus = correctness.</text><text x="290" y="342" text-anchor="middle" class="lbl" fill="#8a2010" font-size="10" opacity=".7">Wrong. Often the opposite is true.</text><rect x="700" y="304" width="420" height="50" rx="6" fill="#2a5a3a" opacity=".1"/><text x="910" y="324" text-anchor="middle" class="lbl" fill="#2a5a3a">Now: The crowd is often pricing in fear.</text><text x="600" y="500" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#4a3818" opacity=".5" font-style="italic">"Errors honestly examined become the best teachers you ever had."</text></svg>