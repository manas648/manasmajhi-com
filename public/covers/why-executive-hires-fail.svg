<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg"><defs><style>.bg{fill:#f4f0e8}.lbl{font-family:Georgia,serif;font-size:12px;fill:#4a3818}@media(prefers-color-scheme:dark){.bg{fill:#0a0806}.lbl{fill:#c8b880}}</style></defs><rect width="1200" height="600" class="bg"/><text x="600" y="60" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#8a2010" font-weight="bold" opacity=".75">Why 40% of Executive Hires Fail in 18 Months</text><circle cx="600" cy="295" r="180" fill="none" stroke="#c8a870" stroke-width="1.5" opacity=".3"/><path d="M600,115 L720,255 L672,435 L528,435 L480,255 Z" fill="#8a2010" opacity=".06" stroke="#8a2010" stroke-width="1" stroke-dasharray="4,3"/><circle cx="600" cy="115" r="8" fill="#8a2010" opacity=".7"/><text x="600" y="95" text-anchor="middle" class="lbl" fill="#8a2010">Wrong brief</text><text x="600" y="78" text-anchor="middle" class="lbl" fill="#8a2010" font-size="10" opacity=".7">Criteria not aligned</text><circle cx="760" cy="270" r="8" fill="#8a2010" opacity=".7"/><text x="820" y="265" class="lbl" fill="#8a2010">Culture mismatch</text><text x="820" y="280" class="lbl" fill="#8a2010" font-size="10" opacity=".7">Values not assessed</text><circle cx="680" cy="450" r="8" fill="#8a2010" opacity=".7"/><text x="700" y="472" class="lbl" fill="#8a2010">Rushed close</text><text x="700" y="487" class="lbl" fill="#8a2010" font-size="10" opacity=".7">Speed over fit</text><circle cx="520" cy="450" r="8" fill="#8a2010" opacity=".7"/><text x="380" y="472" class="lbl" fill="#8a2010">No onboarding</text><text x="380" y="487" class="lbl" fill="#8a2010" font-size="10" opacity=".7">Left to figure it out</text><circle cx="440" cy="270" r="8" fill="#8a2010" opacity=".7"/><text x="240" y="265" text-anchor="end" class="lbl" fill="#8a2010">Board misalignment</text><text x="240" y="280" text-anchor="end" class="lbl" fill="#8a2010" font-size="10" opacity=".7">CEO vs board conflict</text><line x1="600" y1="115" x2="760" y2="270" stroke=