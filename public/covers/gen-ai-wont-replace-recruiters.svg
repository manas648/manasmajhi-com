<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg"><defs><style>.bg{fill:#f4f0e8}.lbl{font-family:Georgia,serif;font-size:12px}@media(prefers-color-scheme:dark){.bg{fill:#0a0806}}</style></defs><rect width="1200" height="600" class="bg"/><line x1="600" y1="60" x2="600" y2="540" stroke="#c8b880" stroke-width="1" stroke-dasharray="6,4" opacity=".4"/><text x="300" y="80" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#2a5a8a" font-weight="bold">AI does well</text><text x="900" y="80" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#8a4010" font-weight="bold">Humans still own</text><rect x="100" y="110" width="400" height="36" rx="6" fill="#2a5a8a" opacity=".2"/><text x="300" y="134" text-anchor="middle" class="lbl" fill="#2a5a8a">Resume screening at scale</text><rect x="100" y="158" width="400" height="36" rx="6" fill="#2a5a8a" opacity=".2"/><text x="300" y="182" text-anchor="middle" class="lbl" fill="#2a5a8a">Boolean search & sourcing</text><rect x="100" y="206" width="400" height="36" rx="6" fill="#2a5a8a" opacity=".2"/><text x="300" y="230" text-anchor="middle" class="lbl" fill="#2a5a8a">Pattern matching in data</text><rect x="100" y="254" width="400" height="36" rx="6" fill="#2a5a8a" opacity=".2"/><text x="300" y="278" text-anchor="middle" class="lbl" fill="#2a5a8a">Draft outreach sequences</text><rect x="100" y="302" width="400" height="36" rx="6" fill="#2a5a8a" opacity=".2"/><text x="300" y="326" text-anchor="middle" class="lbl" fill="#2a5a8a">CRM data entry &amp; hygiene</text><rect x="100" y="350" width="400" height="36" rx="6" fill="#2a5a8a" opacity=".15"/><text x="300" y="374" text-anchor="middle" class="lbl" fill="#2a5a8a">Interview scheduling</text><rect x="700" y="110" width="400" height="36" rx="6" fill="#8a4010" opacity=".18"/><text x="900" y="134" text-anchor="middle" class="lbl" fill="#8a4010">Reading a room in person</text><rect x="700" y="158" width="400" height="36" rx="6" fill="#8a4010" opacity=".2"/><text x="900" y="182" text-anchor="middle" class="lbl" fill="#8a4010">Trust and confidentiality</text><rect x="700" y="206" width="400" height="36" rx="6" fill="#8a4010" opacity=".22"/><text x="900" y="230" text-anchor="middle" class="lbl" fill="#8a4010">Stakeholder alignment</text><rect x="700" y="254" width="400" height="36" rx="6" fill="#8a4010" opacity=".22"/><text x="900" y="278" text-anchor="middle" class="lbl" fill="#8a4010">Motivating passive candidates</text><rect x="700" y="302" width="400" height="36" rx="6" fill="#8a4010" opacity=".2"/><text x="900" y="326" text-anchor="middle" class="lbl" fill="#8a4010">Navigating internal politics</text><rect x="700" y="350" width="400" height="36" rx="6" fill="#8a4010" opacity=".18"/><text x="900" y="374" text-anchor="middle" class="lbl" fill="#8a4010">Judgment on culture fit</text><rect x="700" y="398" width="400" height="36" rx="6" fill="#8a4010" opacity=".22"/><text x="900" y="422" text-anchor="middle" class="lbl" fill="#8a4010">Negotiating the close</text><text x="600" y="510" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#4a3818" opacity=".5" font-style="italic">"AI makes recruiters faster. It does not make them obsolete."</text></svg>