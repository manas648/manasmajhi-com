<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg"><defs><style>.bg{fill:#f4f0e8}.lbl{font-family:Georgia,serif;font-size:11px;fill:#4a3818}@media(prefers-color-scheme:dark){.bg{fill:#0a0806}.lbl{fill:#c8b880}}</style></defs><rect width="1200" height="600" class="bg"/><circle cx="480" cy="280" r="180" fill="#2a4060" opacity=".08" stroke="#2a4060" stroke-width="1.5"/><circle cx="720" cy="280" r="180" fill="#8a3a10" opacity=".08" stroke="#8a3a10" stroke-width="1.5"/><text x="340" y="275" text-anchor="middle" class="lbl" fill="#2a4060" opacity=".7">Different</text><text x="340" y="292" text-anchor="middle" class="lbl" fill="#2a4060" opacity=".6" font-size="10">language, faith, aesthetics</text><text x="860" y="275" text-anchor="middle" class="lbl" fill="#8a3a10" opacity=".7">Different</text><text x="860" y="292" text-anchor="middle" class="lbl" fill="#8a3a10" opacity=".6" font-size="10">culture, history, politics</text><text x="600" y="185" text-anchor="middle" class="lbl" fill="#2a5a3a" font-weight="bold">The overlap</text><text x="600" y="225" text-anchor="middle" class="lbl" fill="#2a5a3a" opacity=".75">Want safety</text><text x="600" y="245" text-anchor="middle" class="lbl" fill="#2a5a3a" opacity=".75">Love their people</text><text x="600" y="265" text-anchor="middle" class="lbl" fill="#2a5a3a" opacity=".75">Fear loss</text><text x="600" y="285" text-anchor="middle" class="lbl" fill="#2a5a3a" opacity=".75">Seek meaning</text><text x="600" y="305" text-anchor="middle" class="lbl" fill="#2a5a3a" opacity=".75">Hope for better</text><text x="600" y="325" text-anchor="middle" class="lbl" fill="#2a5a3a" opacity=".75">Feel pride and shame</text><text x="600" y="345" text-anchor="middle" class="lbl" fill="#2a5a3a" opacity=".75">Want to matter</text><text x="600" y="510" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#4a3818" opacity=".5" font-style="italic">"Travel long enough and the differences start to look like surface. The core is the same."</text></svg>