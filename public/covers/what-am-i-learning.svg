<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg"><defs><style>.bg{fill:#f4f0e8}.lbl{font-family:Georgia,serif;font-size:12px;fill:#4a3818}@media(prefers-color-scheme:dark){.bg{fill:#0a0806}.lbl{fill:#c8b880}}</style></defs><rect width="1200" height="600" class="bg"/><text x="600" y="58" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#2a4060" opacity=".7" font-weight="bold">Questions that drive my learning</text><rect x="80" y="90" width="320" height="100" rx="8" fill="#2a4060" opacity=".08" stroke="#2a4060" stroke-width="1"/><text x="240" y="118" text-anchor="middle" class="lbl" fill="#2a4060">Why do systems fail</text><text x="240" y="136" text-anchor="middle" class="lbl" fill="#2a4060">predictably?</text><text x="240" y="160" text-anchor="middle" class="lbl" fill="#2a4060" font-size="10" opacity=".6">Operations · Infrastructure</text><rect x="440" y="90" width="320" height="100" rx="8" fill="#2a5a3a" opacity=".1" stroke="#2a5a3a" stroke-width="1"/><text x="600" y="118" text-anchor="middle" class="lbl" fill="#2a5a3a">What separates those</text><text x="600" y="136" text-anchor="middle" class="lbl" fill="#2a5a3a">who break through?</text><text x="600" y="160" text-anchor="middle" class="lbl" fill="#2a5a3a" font-size="10" opacity=".6">Human behaviour · Opportunity</text><rect x="800" y="90" width="320" height="100" rx="8" fill="#8a3a10" opacity=".08" stroke="#8a3a10" stroke-width="1"/><text x="960" y="118" text-anchor="middle" class="lbl" fill="#8a3a10">How does technology</text><text x="960" y="136" text-anchor="middle" class="lbl" fill="#8a3a10">redistribute power?</text><text x="960" y="160" text-anchor="middle" class="lbl" fill="#8a3a10" font-size="10" opacity=".6">AI · Digital infrastructure</text><rect x="80" y="220" width="320" height="100" rx="8" fill="#6a3a80" opacity=".08" stroke="#6a3a80" stroke-width="1"/><text x="240" y="248" text-anchor="middle" class="lbl" fill="#6a3a80">What makes institutions</text><text x="240" y="266" text-anchor="middle" class="lbl" fill="#6a3a80">durable?</text><text x="240" y="290" text-anchor="middle" class="lbl" fill="#6a3a80" font-size="10" opacity=".6">Governance · History</text><rect x="440" y="220" width="320" height="100" rx="8" fill="#c87020" opacity=".08" stroke="#c87020" stroke-width="1"/><text x="600" y="248" text-anchor="middle" class="lbl" fill="#c87020">Where does compound</text><text x="600" y="266" text-anchor="middle" class="lbl" fill="#c87020">learning come from?</text><text x="600" y="290" text-anchor="middle" class="lbl" fill="#c87020" font-size="10" opacity=".6">Mental models · Practice</text><rect x="800" y="220" width="320" height="100" rx="8" fill="#3a6020" opacity=".08" stroke="#3a6020" stroke-width="1"/><text x="960" y="248" text-anchor="middle" class="lbl" fill="#3a6020">What does great look</text><text x="960" y="266" text-anchor="middle" class="lbl" fill="#3a6020">like from the inside?</text><text x="960" y="290" text-anchor="middle" class="lbl" fill="#3a6020" font-size="10" opacity=".6">Excellence · Craft</text><rect x="260" y="350" width="300" height="100" rx="8" fill="#2a4060" opacity=".06" stroke="#2a4060" stroke-width="1"/><text x="410" y="378" text-anchor="middle" class="lbl" fill="#2a4060">What would I think</text><text x="410" y="396" text-anchor="middle" class="lbl" fill="#2a4060">differently in 10 years?</text><text x="410" y="420" text-anchor="middle" class="lbl" fill="#2a4060" font-size="10" opacity=".6">Self-awareness · Time</text><rect x="640" y="350" width="300" height="100" rx="8" fill="#8a5010" opacity=".08" stroke="#8a5010" stroke-width="1"/><text x="790" y="378" text-anchor="middle" class="lbl" fill="#8a5010">Where is the next</text><text x="790" y="396" text-anchor="middle" class="lbl" fill="#8a5010">leverage point?</text><text x="790" y="420" text-anchor="middle" class="lbl" fill="#8a5010" font-size="10" opacity=".6">Strategy · Execution</text><text x="600" y="527" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#4a3818" opacity=".5" font-style="italic">"Learning is not accumulation. It is the revision of what you thought you knew."</text></svg>