<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg3 { fill: #f5f0ea; }
      .resource { fill: #a04010; }
      .gap { fill: none; stroke: #c04820; stroke-width: 2; stroke-dasharray: 8,6; }
      .outcome { fill: #1a3a5a; }
      .connector { fill: none; stroke: #888878; stroke-width: 1.5; }
      .label-text { font-family: Georgia, serif; font-size: 16px; fill: #2a2010; }
      .label-sm { font-family: Georgia, serif; font-size: 12px; fill: #6a5840; }
      .arrow { fill: #888878; }
      @media (prefers-color-scheme: dark) {
        .bg3 { fill: #0e0c08; }
        .resource { fill: #c06030; }
        .outcome { fill: #4080c0; }
        .label-text { fill: #e8d8b8; }
        .label-sm { fill: #a89878; }
        .connector { stroke: #504838; }
        .arrow { fill: #504838; }
      }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" class="arrow"/>
    </marker>
  </defs>

  <rect width="1200" height="600" class="bg3"/>

  <!-- Left column: INPUTS (resources present) -->
  <!-- Title -->
  <text x="200" y="58" class="label-text" text-anchor="middle" font-weight="bold" opacity="0.7" font-size="13" letter-spacing="3">INPUTS</text>

  <!-- Resource nodes — stacked vertically -->
  <rect x="80" y="80" width="240" height="52" rx="8" class="resource" opacity="0.85"/>
  <text x="200" y="112" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#f5e8d0" font-weight="bold">Bauxite deposits</text>

  <rect x="80" y="152" width="240" height="52" rx="8" class="resource" opacity="0.75"/>
  <text x="200" y="184" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#f5e8d0" font-weight="bold">Fertile land</text>

  <rect x="80" y="224" width="240" height="52" rx="8" class="resource" opacity="0.7"/>
  <text x="200" y="256" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#f5e8d0" font-weight="bold">River systems</text>

  <rect x="80" y="296" width="240" height="52" rx="8" class="resource" opacity="0.65"/>
  <text x="200" y="328" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#f5e8d0" font-weight="bold">Forest cover</text>

  <rect x="80" y="368" width="240" height="52" rx="8" class="resource" opacity="0.8"/>
  <text x="200" y="400" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#f5e8d0" font-weight="bold">Human capability</text>

  <!-- Arrows from inputs toward centre -->
  <line x1="320" y1="106" x2="440" y2="200" class="connector" marker-end="url(#arrowhead)" opacity="0.5"/>
  <line x1="320" y1="178" x2="440" y2="240" class="connector" marker-end="url(#arrowhead)" opacity="0.5"/>
  <line x1="320" y1="250" x2="440" y2="280" class="connector" marker-end="url(#arrowhead)" opacity="0.5"/>
  <line x1="320" y1="322" x2="440" y2="320" class="connector" marker-end="url(#arrowhead)" opacity="0.5"/>
  <line x1="320" y1="394" x2="440" y2="360" class="connector" marker-end="url(#arrowhead)" opacity="0.5"/>

  <!-- Middle column: THE GAP (missing translation layer) -->
  <!-- Dashed boundary box suggesting absence -->
  <rect x="440" y="130" width="320" height="330" rx="12" class="gap"/>

  <text x="600" y="185" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#c04820" opacity="0.7" letter-spacing="2">MISSING</text>
  <text x="600" y="220" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#c04820" font-weight="bold">Translation</text>
  <text x="600" y="248" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#c04820" font-weight="bold">Layer</text>

  <!-- Missing components listed inside -->
  <text x="600" y="295" text-anchor="middle" class="label-sm">Infrastructure</text>
  <line x1="490" y1="300" x2="710" y2="300" stroke="#c04820" stroke-width="0.5" opacity="0.3"/>
  <text x="600" y="323" text-anchor="middle" class="label-sm">Processing capacity</text>
  <line x1="490" y1="328" x2="710" y2="328" stroke="#c04820" stroke-width="0.5" opacity="0.3"/>
  <text x="600" y="351" text-anchor="middle" class="label-sm">Market access</text>
  <line x1="490" y1="356" x2="710" y2="356" stroke="#c04820" stroke-width="0.5" opacity="0.3"/>
  <text x="600" y="379" text-anchor="middle" class="label-sm">Financing systems</text>
  <line x1="490" y1="384" x2="710" y2="384" stroke="#c04820" stroke-width="0.5" opacity="0.3"/>
  <text x="600" y="407" text-anchor="middle" class="label-sm">Institutional stability</text>

  <!-- X marks over middle -->
  <line x1="520" y1="155" x2="560" y2="130" stroke="#c04820" stroke-width="1.5" opacity="0.4"/>
  <line x1="560" y1="155" x2="520" y2="130" stroke="#c04820" stroke-width="1.5" opacity="0.4"/>

  <!-- Blocked arrows — inputs don't reach output -->
  <line x1="760" y1="280" x2="840" y2="280" class="connector" stroke-dasharray="4,3" opacity="0.3" marker-end="url(#arrowhead)"/>

  <!-- Right column: OUTCOME (what should be — dim) -->
  <text x="1000" y="58" class="label-text" text-anchor="middle" font-weight="bold" opacity="0.7" font-size="13" letter-spacing="3">OUTCOMES</text>

  <rect x="880" y="80" width="240" height="52" rx="8" class="outcome" opacity="0.25"/>
  <text x="1000" y="112" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#4080c0" opacity="0.5">Economic compounding</text>

  <rect x="880" y="152" width="240" height="52" rx="8" class="outcome" opacity="0.2"/>
  <text x="1000" y="184" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#4080c0" opacity="0.5">Jobs and income</text>

  <rect x="880" y="224" width="240" height="52" rx="8" class="outcome" opacity="0.2"/>
  <text x="1000" y="256" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#4080c0" opacity="0.5">Infrastructure growth</text>

  <rect x="880" y="296" width="240" height="52" rx="8" class="outcome" opacity="0.2"/>
  <text x="1000" y="328" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#4080c0" opacity="0.5">Mobility and education</text>

  <rect x="880" y="368" width="240" height="52" rx="8" class="outcome" opacity="0.2"/>
  <text x="1000" y="400" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#4080c0" opacity="0.5">Human flourishing</text>

  <!-- Bottom insight line -->
  <line x1="80" y1="520" x2="1120" y2="520" stroke="#c8b898" stroke-width="0.5" opacity="0.4"/>
  <text x="600" y="555" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#2a2010" opacity="0.55" font-style="italic">"The resources were there. The translation layer was broken."</text>
</svg>
